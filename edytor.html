  <title>CWEL(f) - Edytor Linii Frontu</title>
  
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 576 512'%3E%3Cpath fill='%2310b981' d='M384 476.1L192 421.2l-148.2 49.4C19.7 478.7 0 460.6 0 435.5V107.5c0-18.7 12.8-35 30.9-39.5l161.1-40.3 192 54.9 148.2-49.4c24.1-8 43.8 10.1 43.8 35.2v328c0 18.7-12.8 35-30.9 39.5L384 476.1zm-96-368.6c-44.2 0-80 35.8-80 80c0 40.8 66.8 126.9 74.4 136.6c2.8 3.6 8.3 3.6 11.2 0c7.6-9.7 74.4-95.8 74.4-136.6c0-44.2-35.8-80-80-80zm0 112a32 32 0 1 1 0-64 32 32 0 1 1 0 64z'/%3E%3C/svg%3E">

<body class="bg-tactical-950 text-slate-300 font-sans h-screen flex flex-col">

  <!-- Modal Ikonek Tailwind -->
  <div id="icon-modal" class="fixed inset-0 bg-black/70 z-[9999] flex justify-center items-center backdrop-blur-sm">
    <div class="bg-tactical-900 border border-tactical-700 rounded-xl p-6 shadow-2xl max-w-sm w-full">
      <h3 class="text-lg font-bold text-white mb-4 border-b border-tactical-700 pb-2">Wybierz typ jednostki</h3>
      <div class="grid grid-cols-2 gap-3 mb-4">
        <button onclick="window.wybierzIkone('czolg')" class="bg-tactical-800 hover:bg-tactical-700 border border-tactical-600 p-2 rounded text-sm"><span class="text-lg">🛡️</span> Czołg</button>
        <button onclick="window.wybierzIkone('piechota')" class="bg-tactical-800 hover:bg-tactical-700 border border-tactical-600 p-2 rounded text-sm"><span class="text-lg">🪖</span> Piechota</button>
        <button onclick="window.wybierzIkone('zmech')" class="bg-tactical-800 hover:bg-tactical-700 border border-tactical-600 p-2 rounded text-sm"><span class="text-lg">⚙️</span> Zmechanizowana</button>
        <button onclick="window.wybierzIkone('kwadrat')" class="bg-tactical-800 hover:bg-tactical-700 border border-tactical-600 p-2 rounded text-sm"><span class="text-lg">⬛</span> Sztab / Kwadrat</button>
        <button onclick="window.wybierzIkone('kolo')" class="bg-tactical-800 hover:bg-tactical-700 border border-tactical-600 p-2 rounded text-sm col-span-2"><span class="text-lg">🔴</span> Inne / Koło</button>

        <input type="file" id="custom-icon-upload" accept="image/*" class="mt-2 w-full text-slate-500 file:mr-4 file:py-1 file:px-3 file:rounded file:border-0 file:text-xs file:bg-tactical-800 file:text-white">
      </div>
      <button onclick="window.anulujDodawanie()" class="w-full py-2 bg-red-900/30 hover:bg-red-600 text-red-200 hover:text-white border border-red-800 rounded transition-colors text-sm font-bold">
        ❌ Anuluj
      </button>

  <!-- Biblioteki Skryptowe -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/@geoman-io/leaflet-geoman-free@2.14.2/dist/leaflet-geoman.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>
  <script src="https://unpkg.com/leaflet-polylinedecorator/dist/leaflet.polylineDecorator.js"></script>

  <!-- LOGIKA EDYTORA -->
  <script>
    // 1. Inicjalizacja Bazy i Czasu
    const SUPABASE_URL = 'https://pdshnuybcijmotizpgxy.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_Q8cmNNSUVGzlSoev2GK-Gg_CiKxQkth';
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const urlParams = new URLSearchParams(window.location.search);
    const BATTLE_ID = urlParams.get('battle_id');
    if (!BATTLE_ID) {
      alert("Błąd: Nie przekazano ID bitwy w adresie URL.");
      window.location.href = "bitwy.html";
    }

    let battleData = null;
    let CZAS_START = Date.UTC(1939, 8, 1, 4, 0);   
    let CZAS_KONIEC = Date.UTC(1939, 9, 6, 23, 0); 
    const GODZINA = 3600000;
    let czasTeraz = CZAS_START;

    // 2. Inicjalizacja Mapy
    const map = L.map('map').setView([52.069, 19.480], 6);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '&copy; OSM' }).addTo(map);

    map.pm.addControls({
      position: 'topleft', drawCircleMarker: false, drawCircle: false, drawText: false, 
      editMode: false, dragMode: true, cutPolygon: true, removalMode: true,
    });
    map.pm.setGlobalOptions({ snappable: false });

    // 3. Stan Edytora
    let historiaMapy = [];
    let wybraneDoAneksji = [];
    let trybRysowaniaStrzalki = false;
    let trybMalowania = false;
    let nazwyPermanentne = false; // Steruje zachowaniem Tooltipów (Hover vs Zawsze widoczne)
    let klatki = {}; 

    let frakcje = {
        pl: { nazwa: 'Polska', kolor: '#e63946' },
        de: { nazwa: 'Niemcy', kolor: '#495057' },
        su: { nazwa: 'ZSRR', kolor: '#d9480f' },
        neutral: { nazwa: 'Neutralne', kolor: '#adb5bd' },
    };
    let aktywnaFrakcja = 'pl';

    async function loadBattleData() {
      const { data: b, error } = await db.from('campaigns').select('*').eq('id', BATTLE_ID).single();
      if(b) {
        battleData = b;
        document.getElementById('battle-title').innerText = "Edytor: " + b.name;
        if(b.start_time) CZAS_START = new Date(b.start_time).getTime();
        if(b.end_time) CZAS_KONIEC = new Date(b.end_time).getTime();
        czasTeraz = CZAS_START;
        document.getElementById('czas-suwak').max = Math.round((CZAS_KONIEC - CZAS_START) / GODZINA);
      }

      const { data: s } = await db.from('sides').select('*').eq('battle_id', BATTLE_ID);
      if(s && s.length > 0) {
        frakcje = {};
        s.forEach(side => {
           const key = side.id.split('-').pop();
           frakcje[key] = { nazwa: side.name, kolor: side.color, _realId: side.id };
           if(!aktywnaFrakcja) aktywnaFrakcja = key;
        });
      }

      odswiezListeFrakcji();
      odswiezZnaczniki();
      ustawCzas(CZAS_START);
    }
    loadBattleData();

    // 4. Narzędzia Mapy
    function zapiszStan(tylkoHistoria = false) {
      const features = map.pm.getGeomanLayers().map(layer => layer.toGeoJSON());
      const stan = { type: "FeatureCollection", features };
      const ostatni = historiaMapy[historiaMapy.length - 1];
      if (ostatni && JSON.stringify(ostatni.features) === JSON.stringify(stan.features)) return;
      
      historiaMapy.push(stan);
      if (historiaMapy.length > 15) historiaMapy.shift();
      if (!tylkoHistoria) zapiszKlatke(stan);
    }

    // GŁÓWNA FUNKCJA WGRYWAJĄCA STAN / GEOJSON
    function odtworzStan(geoJsonData) {
      map.pm.disableDraw();
      
      // Czyścimy obecne obiekty na mapie
      map.pm.getGeomanLayers().forEach(layer => layer.remove());
      
      if (!geoJsonData || !geoJsonData.features || geoJsonData.features.length === 0) return;

      // Tworzymy bufor geoJSON z domyślnym stylem dla państw bez frakcji
      const bufferLayer = L.geoJSON(geoJsonData, {
          style: function(feature) {
              if (!feature.properties || !feature.properties.frakcja) {
                  return { color: '#64748b', fillColor: '#334155', fillOpacity: 0.2, weight: 2 };
              }
          }
      });

      // Zrzucamy obiekty z bufora bezpośrednio na mapę (by Geoman mógł je edytować)
      bufferLayer.getLayers().forEach(layer => {
          layer.addTo(map);
          layer.options.pmIgnore = false;
          L.PM.reInitLayer(layer);

          const props = layer.feature?.properties;
          
          if (props?.isArrow && layer instanceof L.Polyline) {
              stylujStrzalke(layer, props.color);
          }
          if (props?.frakcja && !(layer instanceof L.Marker)) {
              zastosujFrakcje(layer, props.frakcja);
          }
          if (layer instanceof L.Marker && props?.iconType) {
              zastosujIkone(layer, props.iconType, props.iconUrl);
          }
          
          // Przypinanie nazw/tooltipów podążających za kursorem (HOVER)
          const nazwa = props?.name || props?.NAME || props?.SUBJECTO;
          if (nazwa) {
              layer.bindTooltip(nazwa, { 
                  permanent: nazwyPermanentne, 
                  sticky: !nazwyPermanentne, // !false = true (czyli podąża za kursorem i reaguje na hover)
                  direction: 'center',
                  className: "text-white font-bold text-[10px] uppercase tracking-wider bg-tactical-900/80 border border-tactical-500 px-2 py-1 rounded shadow-lg pointer-events-none" 
              });
          }
          
          dodajEdycjeIKlikanie(layer);
      });
    }

    function dodajEdycjeIKlikanie(layer) {
      layer.on('pm:dragend pm:edit', () => zapiszStan());

      layer.on('click', (e) => {
          if (map.pm.globalDrawModeEnabled()) return;
          L.DomEvent.stopPropagation(e);
          
          if (trybMalowania) {
              zastosujFrakcje(layer, aktywnaFrakcja);
              zapiszStan();
              return;
          }
          if (e.originalEvent.shiftKey) {
              layer.setStyle({ color: '#ff0000', fillColor: '#ff0000' });
              wybraneDoAneksji.push(layer);
              if (wybraneDoAneksji.length === 2) {
                  wykonajAneksje(wybraneDoAneksji[0], wybraneDoAneksji[1]);
                  wybraneDoAneksji = [];
              }
          } else {
              layer.pm.toggleEdit();
          }
      });

      layer.on('contextmenu', (e) => {
          if (map.pm.globalDrawModeEnabled()) return;
          L.DomEvent.stopPropagation(e);
          
          const props = layer.feature?.properties || {};
          const obecnaNazwa = props?.name || props?.NAME || props?.SUBJECTO || "";
          const nowaNazwa = prompt("Podaj nazwę dla tego obiektu:", obecnaNazwa);

          if (nowaNazwa !== null) {
              layer.feature = layer.feature || { type: "Feature", properties: {} };
              layer.feature.properties.name = nowaNazwa;
              
              // Odświeżenie Tooltipu
              layer.unbindTooltip();
              layer.bindTooltip(nowaNazwa, { 
                  permanent: nazwyPermanentne, 
                  sticky: !nazwyPermanentne, 
                  direction: 'center',
                  className: "text-white font-bold text-[10px] uppercase tracking-wider bg-tactical-900/80 border border-tactical-500 px-2 py-1 rounded shadow-lg pointer-events-none" 
              });
              zapiszStan();
          }
      });
    }

    function wykonajAneksje(w1, w2) {
      try {
          const u = turf.union(turf.featureCollection([w1.toGeoJSON(), w2.toGeoJSON()]));
          if (u) {
              const fid = w1.feature?.properties?.frakcja;
              w1.remove(); w2.remove();
              const nl = L.geoJSON(u).addTo(map);
              
              nl.getLayers().forEach(nk => {
                  nk.options.pmIgnore = false;
                  L.PM.reInitLayer(nk);
                  dodajEdycjeIKlikanie(nk);
                  
                  const nazwa = prompt("Aneksja zakończona! Podaj nazwę nowego terytorium:");
                  nk.feature = nk.feature || { type: "Feature", properties: {} };
                  if (fid) zastosujFrakcje(nk, fid);
                  if (nazwa) {
                      nk.feature.properties.name = nazwa;
                      nk.bindTooltip(nazwa, { 
                          permanent: nazwyPermanentne, 
                          sticky: !nazwyPermanentne, 
                          direction: 'center',
                          className: "text-white font-bold text-[10px] uppercase tracking-wider bg-tactical-900/80 border border-tactical-500 px-2 py-1 rounded shadow-lg pointer-events-none" 
                      });
                  }
              });
              zapiszStan();
          }
      } catch (err) {
          alert("Błąd aneksji.");
          [w1, w2].forEach(w => {
              const id = w.feature?.properties?.frakcja;
              id ? zastosujFrakcje(w, id) : w.setStyle({ color: '#3388ff' });
          });
      }
    }

    const ZDARZENIA_EDYCJI = 'pm:edit pm:markerdrag pm:drag pm:vertexadded pm:vertexremoved';
    function stylujStrzalke(layer, kolor = '#10b981') {
      layer.feature = layer.feature || { type: "Feature", properties: {} };
      layer.feature.properties.isArrow = true;
      layer.feature.properties.color = kolor;
      layer.setStyle({ color: kolor, weight: 4, dashArray: '10, 10' });

      if (layer._grot) map.removeLayer(layer._grot);
      if (layer._odswiezGrot) layer.off(ZDARZENIA_EDYCJI, layer._odswiezGrot);
      if (layer._usunGrot) layer.off('remove', layer._usunGrot);

      layer._grot = L.polylineDecorator(layer, {
          patterns: [{ offset: '100%', repeat: 0, symbol: L.Symbol.arrowHead({ pixelSize: 18, polygon: true, pathOptions: { color: kolor, fillColor: kolor, fillOpacity: 1, weight: 2, pmIgnore: true } }) }]
      }).addTo(map);
      layer._odswiezGrot = () => layer._grot && layer._grot.setPaths(layer.getLatLngs());
      layer._usunGrot = () => { if (layer._grot) map.removeLayer(layer._grot); };
      layer.on(ZDARZENIA_EDYCJI, layer._odswiezGrot);
      layer.on('remove', layer._usunGrot);
    }

    function zastosujFrakcje(layer, id) {
      const f = frakcje[id];
      if (!f) return;
      layer.feature = layer.feature || { type: "Feature", properties: {} };
      layer.feature.properties.frakcja = id;

      if (layer instanceof L.Marker) {
          if (layer.feature.properties.iconType) zastosujIkone(layer, layer.feature.properties.iconType, layer.feature.properties.iconUrl);
      } else if (layer.feature.properties.isArrow && layer instanceof L.Polyline) {
          stylujStrzalke(layer, f.kolor);
      } else if (layer instanceof L.Polygon) {
          layer.setStyle({ color: f.kolor, fillColor: f.kolor, fillOpacity: 0.35, weight: 2 });
      } else if (layer instanceof L.Polyline) {
          layer.setStyle({ color: f.kolor });
      }
    }

    // 5. Wydarzenia Geoman i Tworzenie Markerów
    let oczekujacyMarker = null;
    map.on('pm:create', (e) => {
      const layer = e.layer;
      layer.feature = layer.feature || { type: "Feature", properties: {} };

      if (e.shape === 'Marker') {
          layer.feature.properties.frakcja = aktywnaFrakcja; 
          oczekujacyMarker = layer;
          document.getElementById('icon-modal').style.display = 'flex';
      } else if (e.shape === 'Line') {
          if (trybRysowaniaStrzalki) {
              layer.feature.properties.isArrow = true;
              trybRysowaniaStrzalki = false;
          }
          zastosujFrakcje(layer, aktywnaFrakcja);
          dodajEdycjeIKlikanie(layer);
          zapiszStan();
      } else {
          zastosujFrakcje(layer, aktywnaFrakcja);
          dodajEdycjeIKlikanie(layer);
          zapiszStan();
      }
    });

    window.wybierzIkone = function (typ) { zastosujIkone(oczekujacyMarker, typ, null); zamknijModalIDokoncz(); }
    window.anulujDodawanie = function () { document.getElementById('icon-modal').style.display = 'none'; if (oczekujacyMarker) { map.removeLayer(oczekujacyMarker); oczekujacyMarker = null; } }
    
    document.getElementById('custom-icon-upload').addEventListener('change', function (e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function (event) { zastosujIkone(oczekujacyMarker, 'custom', event.target.result); zamknijModalIDokoncz(); document.getElementById('custom-icon-upload').value = ''; }
      reader.readAsDataURL(file);
    });

    function zastosujIkone(layer, typ, url) {
      layer.feature = layer.feature || { type: "Feature", properties: {} };
      layer.feature.properties.iconType = typ;
      if (url) layer.feature.properties.iconUrl = url;

      let icon;
      if (typ === 'custom') {
          icon = L.icon({ iconUrl: url, iconSize: [40, 40], iconAnchor: [20, 20] });
      } else {
          let emoji = '📍';
          if (typ === 'czolg') emoji = '🛡️';
          if (typ === 'piechota') emoji = '🪖';
          if (typ === 'zmech') emoji = '⚙️';
          if (typ === 'kwadrat') emoji = '⬛';
          if (typ === 'kolo') emoji = '🔴';
          const kolor = frakcje[layer.feature.properties.frakcja]?.kolor || '#888';
          icon = L.divIcon({
              html: `<div style="width:34px;height:34px;margin:-17px 0 0 -17px;display:flex;align-items:center;justify-content:center;font-size:18px;background:#262730;border:3px solid ${kolor};border-radius:50%;">${emoji}</div>`,
              className: 'custom-div-icon shadow-lg'
          });
      }
      layer.setIcon(icon);
    }

    function zamknijModalIDokoncz() {
      document.getElementById('icon-modal').style.display = 'none';
      const nazwa = prompt("Podaj nazwę dla tej jednostki:");
      if (nazwa) {
          oczekujacyMarker.feature.properties.name = nazwa;
          oczekujacyMarker.bindTooltip(nazwa, { 
              permanent: nazwyPermanentne, 
              sticky: !nazwyPermanentne, 
              direction: 'center',
              className: "text-white font-bold text-[10px] uppercase tracking-wider bg-tactical-900/80 border border-tactical-500 px-2 py-1 rounded shadow-lg pointer-events-none" 
          });
      }
      dodajEdycjeIKlikanie(oczekujacyMarker);
      zapiszStan();
      oczekujacyMarker = null;
    }

    map.on('pm:remove', () => zapiszStan());
    map.on('pm:cut', (e) => { e.layer.getLayers().forEach(nk => dodajEdycjeIKlikanie(nk)); zapiszStan(); });
    
    document.getElementById('draw-arrow-btn').addEventListener('click', () => {
      trybRysowaniaStrzalki = true; map.pm.enableDraw('Line', { snappable: false });
    });

    // Przełącznik NAZW (Stale widoczne vs Podążające za Hoverem)
    document.getElementById('toggle-names-btn').addEventListener('click', () => {
        nazwyPermanentne = !nazwyPermanentne;
        const btn = document.getElementById('toggle-names-btn');
        btn.classList.toggle('bg-tactical-accent', nazwyPermanentne);
        btn.classList.toggle('border-tactical-accent', nazwyPermanentne);
        
        map.pm.getGeomanLayers().forEach(layer => {
            const props = layer.feature?.properties;
            const nazwa = props?.name || props?.NAME || props?.SUBJECTO;
            if(nazwa) {
                layer.unbindTooltip();
                layer.bindTooltip(nazwa, { 
                    permanent: nazwyPermanentne, 
                    sticky: !nazwyPermanentne, // Powraca do zachowania "Hover"
                    direction: 'center',
                    className: "text-white font-bold text-[10px] uppercase tracking-wider bg-tactical-900/80 border border-tactical-500 px-2 py-1 rounded shadow-lg pointer-events-none" 
                });
            }
        });
    });

    // 6. Zarządzanie Panelem Frakcji
    const selectFrakcji = document.getElementById('frakcja-select');
    const kolorInput = document.getElementById('frakcja-kolor');
    const malujBtn = document.getElementById('maluj-btn');

    function odswiezListeFrakcji() {
      selectFrakcji.innerHTML = '';
      for (const [id, f] of Object.entries(frakcje)) {
          const opt = document.createElement('option'); opt.value = id; opt.textContent = f.nazwa; selectFrakcji.appendChild(opt);
      }
      if(!frakcje[aktywnaFrakcja]) aktywnaFrakcja = Object.keys(frakcje)[0];
      selectFrakcji.value = aktywnaFrakcja;
      if(frakcje[aktywnaFrakcja]) kolorInput.value = frakcje[aktywnaFrakcja].kolor;
    }
    
    selectFrakcji.addEventListener('change', () => { aktywnaFrakcja = selectFrakcji.value; kolorInput.value = frakcje[aktywnaFrakcja].kolor; });
    kolorInput.addEventListener('input', () => {
      frakcje[aktywnaFrakcja].kolor = kolorInput.value;
      map.pm.getGeomanLayers().forEach(l => { if (l.feature?.properties?.frakcja === aktywnaFrakcja) zastosujFrakcje(l, aktywnaFrakcja); });
    });
    kolorInput.addEventListener('change', () => { zapiszStan(); autozapis(); });
    
    document.getElementById('dodaj-frakcje-btn').addEventListener('click', () => {
      const nazwa = prompt("Nazwa nowej frakcji:"); if (!nazwa) return;
      const id = 'f' + Date.now().toString().slice(-6);
      const losowy = '#' + Math.floor(Math.random() * 0xffffff).toString(16).padStart(6, '0');
      frakcje[id] = { nazwa, kolor: losowy }; aktywnaFrakcja = id;
      odswiezListeFrakcji(); autozapis();
    });

    malujBtn.addEventListener('click', () => {
      trybMalowania = !trybMalowania;
      malujBtn.innerHTML = trybMalowania ? '<i class="fa-solid fa-fill-drip"></i> Malowanie: WŁ.' : '<i class="fa-solid fa-fill-drip"></i> Malowanie: Wył.';
      malujBtn.classList.toggle('bg-tactical-accent', trybMalowania);
      document.getElementById('map').style.cursor = trybMalowania ? 'crosshair' : '';
    });

    // 7. Oś Czasu
    const suwak = document.getElementById('czas-suwak');
    const etykieta = document.getElementById('czas-etykieta');
    const znaczniki = document.getElementById('czas-znaczniki');
    const playBtn = document.getElementById('czas-play');
    
    function najblizszaKlatka(t) { let wynik = null; for (const k of Object.keys(klatki)) { const n = Number(k); if (n <= t && (wynik === null || n > wynik)) wynik = n; } return wynik; }
    
    function zapiszKlatke(stan) {
      const klucz = najblizszaKlatka(czasTeraz);
      const dokladna = klucz === czasTeraz;
      const poprzednia = klucz !== null ? klatki[klucz] : { features: [] };
      const taSama = JSON.stringify(poprzednia.features) === JSON.stringify(stan.features);
      if (dokladna || !taSama) { klatki[czasTeraz] = stan; autozapis(); odswiezZnaczniki(); odswiezEtykiete(); }
    }

    function autozapis() { try { localStorage.setItem('kampania-autozapis-'+BATTLE_ID, JSON.stringify({ frakcje, klatki })); } catch (e) {} }
    
    function odswiezEtykiete() {
      const t = new Date(czasTeraz).toLocaleString('pl-PL', { timeZone: 'UTC', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
      const jestKlatka = najblizszaKlatka(czasTeraz) === czasTeraz;
      etykieta.innerHTML = t + (jestKlatka ? ' <span class="text-red-400 text-xs">● klatka</span>' : '');
    }
    
    function odswiezZnaczniki() {
      znaczniki.innerHTML = ''; const zakres = CZAS_KONIEC - CZAS_START;
      for (const k of Object.keys(klatki)) {
          const proc = ((Number(k) - CZAS_START) / zakres) * 100;
          if (proc >= 0 && proc <= 100) {
              const d = document.createElement('div');
              d.className = "absolute top-0 w-[3px] h-3 bg-red-500 rounded";
              d.style.left = `${proc}%`; d.style.marginLeft = "-1px";
              znaczniki.appendChild(d);
          }
      }
    }
    
    function ustawCzas(t) {
      czasTeraz = Math.min(CZAS_KONIEC, Math.max(CZAS_START, t));
      wybraneDoAneksji = [];
      const klucz = najblizszaKlatka(czasTeraz);
      const stan = klucz !== null ? klatki[klucz] : null;
      odtworzStan(stan);
      historiaMapy = [{ type: "FeatureCollection", features: stan ? stan.features : [] }];
      suwak.value = Math.round((czasTeraz - CZAS_START) / GODZINA);
      odswiezEtykiete();
    }

    suwak.addEventListener('input', () => ustawCzas(CZAS_START + Number(suwak.value) * GODZINA));
    document.getElementById('czas-wstecz').addEventListener('click', () => ustawCzas(czasTeraz - GODZINA));
    document.getElementById('czas-dalej').addEventListener('click', () => ustawCzas(czasTeraz + GODZINA));
    document.getElementById('czas-dzien-wstecz').addEventListener('click', () => ustawCzas(czasTeraz - 24 * GODZINA));
    document.getElementById('czas-dzien-dalej').addEventListener('click', () => ustawCzas(czasTeraz + 24 * GODZINA));
    document.getElementById('czas-usun-klatke').addEventListener('click', () => { if (klatki[czasTeraz]) { delete klatki[czasTeraz]; autozapis(); odswiezZnaczniki(); ustawCzas(czasTeraz); } });

    let timerPlay = null;
    playBtn.addEventListener('click', () => {
      if (timerPlay) { clearInterval(timerPlay); timerPlay = null; playBtn.innerHTML = '<i class="fa-solid fa-play"></i> Odtwórz'; playBtn.classList.remove('text-tactical-accent','border-tactical-accent'); return; }
      playBtn.innerHTML = '<i class="fa-solid fa-pause"></i> Pauza'; playBtn.classList.add('text-tactical-accent','border-tactical-accent');
      timerPlay = setInterval(() => {
          if (czasTeraz >= CZAS_KONIEC) { clearInterval(timerPlay); timerPlay = null; playBtn.innerHTML = '<i class="fa-solid fa-play"></i> Odtwórz'; playBtn.classList.remove('text-tactical-accent'); return; }
          ustawCzas(czasTeraz + GODZINA);
      }, 300);
    });

    // 8. Import / Export Local
    document.getElementById('export-btn').addEventListener('click', () => {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({ format: "kampania-v2", frakcje, klatki }));
      const a = document.createElement('a'); a.href = dataStr; a.download = `kampania_${BATTLE_ID}.json`; document.body.appendChild(a); a.click(); a.remove();
    });
    
    document.getElementById('import-btn').addEventListener('click', () => document.getElementById('import-input').click());
    
    document.getElementById('import-input').addEventListener('change', (e) => {
      const file = e.target.files[0]; if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
          try {
              const d = JSON.parse(e.target.result);
              
              if (d.frakcje || d.klatki) { 
                  if (d.frakcje) { Object.assign(frakcje, d.frakcje); odswiezListeFrakcji(); }
                  if (d.klatki) { klatki = d.klatki; autozapis(); odswiezZnaczniki(); ustawCzas(czasTeraz); }
              } 
              else if (d.type === "FeatureCollection" || d.features) {
                  const obecne = map.pm.getGeomanLayers().map(l => l.toGeoJSON());
                  
                  // Łączymy dotychczasową mapę z zaimportowanymi granicami
                  odtworzStan({ type: "FeatureCollection", features: [...obecne, ...d.features] });
                  zapiszStan();
                  
                  // Wymuszamy przybliżenie kamery na zaimportowane państwa
                  const tempLayer = L.geoJSON(d);
                  map.fitBounds(tempLayer.getBounds());
              }
          } catch(err) { 
              alert("Niepoprawny plik JSON: " + err.message); 
          }
      };
      reader.readAsText(file);
      e.target.value = ''; 
    });
    
    try {
      const zapis = JSON.parse(localStorage.getItem('kampania-autozapis-'+BATTLE_ID));
      if (zapis?.klatki) { klatki = zapis.klatki; Object.assign(frakcje, zapis.frakcje || {}); odswiezListeFrakcji(); }
    } catch(err) {}

    // 9. ZAPIS DO SUPABASE Z KREATORA!
    document.getElementById('export-db-btn').addEventListener('click', async () => {
      if (Object.keys(klatki).length === 0) return alert("Brak klatek do eksportu!");
      const btn = document.getElementById('export-db-btn');
      btn.innerHTML = "<i class='fa-solid fa-spinner fa-spin'></i> Wysyłanie..."; btn.classList.add("bg-yellow-600");

      try {
          // Aktualizacja Frakcji
          for (const [key, f] of Object.entries(frakcje)) {
              const sideId = f._realId || ('00000000-0000-0000-0000-' + key.padEnd(12, '0'));
              await db.from('sides').upsert({ id: sideId, battle_id: BATTLE_ID, name: f.nazwa, color: f.kolor });
              f._realId = sideId;
          }

          const unitsMap = new Map();
          const pozycjeDoBazy = [];
          const graniceWKlatkach = {};

          // Parsowanie Klatek (Snapshotów)
          for (const [timestamp, stan] of Object.entries(klatki)) {
              const recordedAt = new Date(Number(timestamp)).toISOString();
              const sameGranice = [];

              for (const feature of stan.features) {
                  const typ = feature.geometry.type;
                  const props = feature.properties || {};
                  
                  if (typ === 'Polygon' || typ === 'MultiPolygon') sameGranice.push(feature);
                  
                  if (typ === 'Point' && props.name) {
                      let unitId;
                      if (!unitsMap.has(props.name)) {
                          const sideId = frakcje[props.frakcja]?._realId || ('00000000-0000-0000-0000-' + (props.frakcja || 'neutral').padEnd(12, '0'));
                          const { data: newUnit } = await db.from('units').upsert({
                              battle_id: BATTLE_ID, side_id: sideId, name: props.name, unit_type: props.iconType || 'infantry', symbol: props.iconType || 'none'
                          }, { onConflict: 'name, battle_id' }).select('id').single();
                          unitId = newUnit.id; unitsMap.set(props.name, unitId);
                      } else { unitId = unitsMap.get(props.name); }

                      pozycjeDoBazy.push({ unit_id: unitId, recorded_at: recordedAt, longitude: feature.geometry.coordinates[0], latitude: feature.geometry.coordinates[1], heading: 0, strength: 1000 });
                  }
              }
              graniceWKlatkach[timestamp] = sameGranice;
          }

          if (pozycjeDoBazy.length > 0) {
              await db.from('unit_positions').insert(pozycjeDoBazy);
          }
          await db.from('campaigns').update({ map_config: { borders_timeline: graniceWKlatkach } }).eq('id', BATTLE_ID);

          btn.innerHTML = "<i class='fa-solid fa-check'></i> Zapisano"; btn.classList.replace("bg-yellow-600", "bg-green-600");
          setTimeout(() => { btn.innerHTML = "<i class='fa-solid fa-cloud-arrow-up'></i> Zapisz do Bazy"; btn.classList.remove("bg-green-600"); }, 3000);
      } catch (err) {
          alert("Błąd: " + err.message); btn.innerHTML = "❌ Błąd"; btn.classList.replace("bg-yellow-600", "bg-red-600");
      }
    });

    document.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'z') {
          if (historiaMapy.length > 1) {
              historiaMapy.pop();
              const poprzedni = historiaMapy[historiaMapy.length - 1]; odtworzStan(poprzedni); zapiszKlatke(poprzedni);
          }
      }
    });
  </script>
</body>
</html>
