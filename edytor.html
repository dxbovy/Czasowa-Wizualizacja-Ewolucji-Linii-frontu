  <!-- Biblioteki Skryptowe -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>
  <script src="https://unpkg.com/leaflet-polylinedecorator/dist/leaflet.polylineDecorator.js"></script>

  <!-- LOGIKA EDYTORA -->
  <script>
    // 1. Inicjalizacja Bazy i Czasu
    const SUPABASE_URL = 'https://pdshnuybcijmotizpgxy.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_Q8cmNNSUVGzlSoev2GK-Gg_CiKxQkth';
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const urlParams = new URLSearchParams(window.location.search);
    const BATTLE_ID = urlParams.get('battle_id');
    if (!BATTLE_ID) {
      alert("Błąd: Nie przekazano ID bitwy w adresie URL.");
      window.location.href = "bitwy.html";
    }

    let battleData = null;
    let CZAS_START = Date.UTC(1939, 8, 1, 4, 0);   
    let CZAS_KONIEC = Date.UTC(1939, 9, 6, 23, 0); 
    const GODZINA = 3600000;
    let czasTeraz = CZAS_START;

    // 2. Inicjalizacja Mapy
    const map = L.map('map').setView([52.069, 19.480], 6);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '&copy; OSM' }).addTo(map);

    map.pm.addControls({
      position: 'topleft', drawCircleMarker: false, drawCircle: false, drawText: false, 
      editMode: false, dragMode: true, cutPolygon: true, removalMode: true,
    });
    map.pm.setGlobalOptions({ snappable: false });

    // 3. Stan Edytora
    let historiaMapy = [];
    let wybraneDoAneksji = [];
    let trybRysowaniaStrzalki = false;
    let trybMalowania = false;
    let nazwyPermanentne = false; 
    let klatki = {}; 
    let lokalneRozkazy = []; // Przechowuje rozkazy dla jednostek z obecnej sesji

    const idPL = crypto.randomUUID();
    const idDE = crypto.randomUUID();
    const idSU = crypto.randomUUID();
    const idNeutral = crypto.randomUUID();

    let frakcje = {
        [idPL]: { nazwa: 'Polska', kolor: '#e63946' },
        [idDE]: { nazwa: 'Niemcy', kolor: '#495057' },
        [idSU]: { nazwa: 'ZSRR', kolor: '#d9480f' },
        [idNeutral]: { nazwa: 'Neutralne', kolor: '#adb5bd' },
    };
    let aktywnaFrakcja = idPL;

    // 4. ŁADOWANIE DANYCH Z BAZY
    async function loadBattleData() {
      const { data: b } = await db.from('campaigns').select('*').eq('id', BATTLE_ID).single();
      if(b) {
        battleData = b;
        document.getElementById('battle-title').innerText = "Edytor: " + b.name;
        if(b.start_time) CZAS_START = new Date(b.start_time).getTime();
        if(b.end_time) CZAS_KONIEC = new Date(b.end_time).getTime();
        czasTeraz = CZAS_START;
        document.getElementById('czas-suwak').max = Math.round((CZAS_KONIEC - CZAS_START) / GODZINA);
      }

      const { data: s } = await db.from('sides').select('*').eq('campaigns_id', BATTLE_ID);
      if(s && s.length > 0) {
        frakcje = {}; 
        s.forEach(side => {
           frakcje[side.id] = { nazwa: side.name, kolor: side.color };
        });
        aktywnaFrakcja = Object.keys(frakcje)[0];
      }

      let bazoweKlatki = {};

      if (b && b.map_config && b.map_config.borders_timeline) {
          for (const [timestamp, features] of Object.entries(b.map_config.borders_timeline)) {
              bazoweKlatki[timestamp] = { type: "FeatureCollection", features: features };
          }
      }

      const { data: unitsData } = await db.from('units').select('*').eq('campaigns_id', BATTLE_ID);
      if (unitsData && unitsData.length > 0) {
          const unitIds = unitsData.map(u => u.id);
          const { data: posData } = await db.from('unit_positions').select('*').in('unit_id', unitIds);
          
          if (posData && posData.length > 0) {
              posData.forEach(pos => {
                  const unit = unitsData.find(u => u.id === pos.unit_id);
                  if (!unit) return;

                  const ts = new Date(pos.recorded_at).getTime().toString();
                  if (!bazoweKlatki[ts]) bazoweKlatki[ts] = { type: "FeatureCollection", features: [] };

                  bazoweKlatki[ts].features.push({
                      type: "Feature",
                      properties: {
                          name: unit.name,
                          frakcja: unit.side_id,
                          iconType: unit.symbol !== 'none' ? unit.symbol : unit.unit_type
                      },
                      geometry: { type: "Point", coordinates: [pos.longitude, pos.latitude] }
                  });
              });
          }

          // Wczytywanie Rozkazów z Bazy do pamięci podręcznej
          const { data: ordData } = await db.from('orders').select('*').in('unit_id', unitIds);
          if (ordData && ordData.length > 0) {
              ordData.forEach(o => {
                  const unit = unitsData.find(u => u.id === o.unit_id);
                  if (unit) {
                      lokalneRozkazy.push({
                          unitName: unit.name,
                          issued_at: o.issued_at,
                          valid_from: o.valid_from,
                          valid_until: o.valid_until,
                          order_type: o.order_type,
                          description: o.description,
                          target_latitude: o.target_latitude,
                          target_longitude: o.target_longitude
                      });
                  }
              });
          }
      }

      if (Object.keys(bazoweKlatki).length > 0) {
          klatki = bazoweKlatki;
      } else {
          try {
              const zapis = JSON.parse(localStorage.getItem('kampania-autozapis-'+BATTLE_ID));
              if (zapis?.klatki) { klatki = zapis.klatki; Object.assign(frakcje, zapis.frakcje || {}); }
              if (zapis?.rozkazy) { lokalneRozkazy = zapis.rozkazy; }
          } catch(err) {}
      }

      naprawRelacjeFrakcji();
      odswiezListeFrakcji();
      odswiezZnaczniki();
      ustawCzas(CZAS_START);
    }

    function naprawRelacjeFrakcji() {
        const nameToId = {};
        for (const [id, f] of Object.entries(frakcje)) { nameToId[f.nazwa.toLowerCase()] = id; }
        const oldMap = { 'pl': 'polska', 'de': 'niemcy', 'su': 'zsrr', 'neutral': 'neutralne' };
        
        for (const stan of Object.values(klatki)) {
            if (!stan.features) continue;
            for (const feature of stan.features) {
                let fr = feature.properties?.frakcja;
                if (!fr) continue;
                if (!frakcje[fr]) {
                    let expectedName = oldMap[fr] ? oldMap[fr] : null;
                    if (expectedName && nameToId[expectedName]) {
                        feature.properties.frakcja = nameToId[expectedName];
                    } else { feature.properties.frakcja = Object.keys(frakcje)[0]; }
                }
            }
        }
    }
    loadBattleData();

    // 5. Narzędzia Mapy
    function zapiszStan(tylkoHistoria = false) {
      const features = map.pm.getGeomanLayers().map(layer => layer.toGeoJSON());
      const stan = { type: "FeatureCollection", features };
      const ostatni = historiaMapy[historiaMapy.length - 1];
      if (ostatni && JSON.stringify(ostatni.features) === JSON.stringify(stan.features)) return;
      
      historiaMapy.push(stan);
      if (historiaMapy.length > 15) historiaMapy.shift();
      if (!tylkoHistoria) zapiszKlatke(stan);
    }

    function odtworzStan(geoJsonData) {
      map.pm.disableDraw();
      map.pm.getGeomanLayers().forEach(layer => layer.remove());
      if (!geoJsonData || !geoJsonData.features || geoJsonData.features.length === 0) return;

      const bufferLayer = L.geoJSON(geoJsonData, {
          style: function(feature) {
              if (!feature.properties || !feature.properties.frakcja) {
                  return { color: '#64748b', fillColor: '#334155', fillOpacity: 0.2, weight: 2 };
              }
          }
      });

      bufferLayer.getLayers().forEach(layer => {
          layer.addTo(map);
          layer.options.pmIgnore = false;
          L.PM.reInitLayer(layer);

          const props = layer.feature?.properties;
          
          if (props?.isArrow && layer instanceof L.Polyline) stylujStrzalke(layer, props.color);
          if (props?.frakcja && !(layer instanceof L.Marker)) zastosujFrakcje(layer, props.frakcja);
          if (layer instanceof L.Marker && props?.iconType) zastosujIkone(layer, props.iconType, props.iconUrl);
          
          const nazwa = props?.name || props?.NAME || props?.SUBJECTO;
          if (nazwa) {
              layer.bindTooltip(nazwa, { 
                  permanent: nazwyPermanentne, sticky: !nazwyPermanentne, direction: 'center',
                  className: "text-white font-bold text-[10px] uppercase tracking-wider bg-tactical-900/80 border border-tactical-500 px-2 py-1 rounded shadow-lg pointer-events-none" 
              });
          }
          dodajEdycjeIKlikanie(layer);
      });
    }

    // ROZKAZY: Logika modalnego okna edycji
    let edytowanaJednostka = null;
    let tymczasowyCelRozkazu = null;

    function otworzOpcjeJednostki(layer) {
        edytowanaJednostka = layer;
        tymczasowyCelRozkazu = null;
        document.getElementById('uc-name').value = layer.feature.properties.name || "";
        document.getElementById('uc-time').innerText = new Date(czasTeraz).toLocaleString('pl-PL', { dateStyle: 'short', timeStyle: 'short' });
        document.getElementById('uc-desc').value = "";
        document.getElementById('uc-target-info').innerText = "Brak celu";
        
        document.getElementById('unit-context-modal').style.display = 'flex';
    }

    function zamknijOpcjeJednostki() {
        document.getElementById('unit-context-modal').style.display = 'none';
        edytowanaJednostka = null;
    }

    function wybierzCelRozkazu() {
        document.getElementById('unit-context-modal').style.display = 'none';
        alert("Wskaż koordynaty na mapie (kliknij), aby ustalić cel rozkazu.");
        
        // Złapanie pierwszego kliknięcia myszą na mapę
        map.once('click', (e) => {
            tymczasowyCelRozkazu = e.latlng;
            document.getElementById('uc-target-info').innerHTML = `<span class="text-tactical-accent font-bold">Zapisano CEL:</span> ${e.latlng.lat.toFixed(2)}, ${e.latlng.lng.toFixed(2)}`;
            document.getElementById('unit-context-modal').style.display = 'flex'; // Przywrócenie okienka
        });
    }

    function zapiszOpcjeJednostki() {
        if(!edytowanaJednostka) return;
        
        const nowaNazwa = document.getElementById('uc-name').value;
        edytowanaJednostka.feature.properties.name = nowaNazwa;
        
        edytowanaJednostka.unbindTooltip();
        edytowanaJednostka.bindTooltip(nowaNazwa, { 
            permanent: nazwyPermanentne, sticky: !nazwyPermanentne, direction: 'center',
            className: "text-white font-bold text-[10px] uppercase tracking-wider bg-tactical-900/80 border border-tactical-500 px-2 py-1 rounded shadow-lg pointer-events-none" 
        });

        const desc = document.getElementById('uc-desc').value;
        if(desc.trim() !== "") {
            lokalneRozkazy.push({
                unitName: nowaNazwa,
                order_type: document.getElementById('uc-type').value,
                description: desc,
                issued_at: new Date(czasTeraz).toISOString(),
                valid_from: new Date(czasTeraz).toISOString(),
                target_latitude: tymczasowyCelRozkazu ? tymczasowyCelRozkazu.lat : null,
                target_longitude: tymczasowyCelRozkazu ? tymczasowyCelRozkazu.lng : null
            });
        }
        zapiszStan();
        zamknijOpcjeJednostki();
    }

    function dodajEdycjeIKlikanie(layer) {
      layer.on('pm:dragend pm:edit', () => zapiszStan());

      layer.on('click', (e) => {
          if (map.pm.globalDrawModeEnabled()) return;
          L.DomEvent.stopPropagation(e);
          
          if (trybMalowania) {
              zastosujFrakcje(layer, aktywnaFrakcja);
              zapiszStan(); return;
          }
          if (e.originalEvent.shiftKey) {
              layer.setStyle({ color: '#ff0000', fillColor: '#ff0000' });
              wybraneDoAneksji.push(layer);
              if (wybraneDoAneksji.length === 2) {
                  wykonajAneksje(wybraneDoAneksji[0], wybraneDoAneksji[1]); wybraneDoAneksji = [];
              }
          } else { layer.pm.toggleEdit(); }
      });

      // Prawy klik (Opcje / Rozkazy)
      layer.on('contextmenu', (e) => {
          if (map.pm.globalDrawModeEnabled()) return;
          L.DomEvent.stopPropagation(e);
          
          const props = layer.feature?.properties || {};
          const isBattle = props?.iconType === 'battle';
          
          if (isBattle) {
              const obecnaNazwa = props?.name || props?.NAME || props?.SUBJECTO || "";
              const nowaNazwa = prompt("Zmień nazwę bitwy:", obecnaNazwa);

              if (nowaNazwa !== null) {
                  layer.feature = layer.feature || { type: "Feature", properties: {} };
                  layer.feature.properties.name = nowaNazwa;
                  const desc = prompt("Zmień opis bitwy:", props.description || "");
                  const res = prompt("Zmień wynik bitwy:", props.result || "");
                  layer.feature.properties.description = desc || "";
                  layer.feature.properties.result = res || "";
                  
                  layer.unbindTooltip();
                  layer.bindTooltip(nowaNazwa, { permanent: nazwyPermanentne, sticky: !nazwyPermanentne, direction: 'center', className: "text-white font-bold text-[10px] uppercase tracking-wider bg-tactical-900/80 border border-tactical-500 px-2 py-1 rounded shadow-lg pointer-events-none" });
                  zapiszStan();
              }
          } else if (layer instanceof L.Marker) {
              // Zwykła Jednostka (otwórz modal rozkazów)
              otworzOpcjeJednostki(layer);
          } else {
              // Granice / Linie
              const nowaNazwa = prompt("Zmień nazwę terytorium/linii:", props?.name || "");
              if (nowaNazwa !== null) {
                  layer.feature.properties.name = nowaNazwa;
                  layer.unbindTooltip();
                  layer.bindTooltip(nowaNazwa, { permanent: nazwyPermanentne, sticky: !nazwyPermanentne, direction: 'center', className: "text-white font-bold text-[10px] uppercase tracking-wider bg-tactical-900/80 border border-tactical-500 px-2 py-1 rounded shadow-lg pointer-events-none" });
                  zapiszStan();
              }
          }
      });
    }

    function wykonajAneksje(w1, w2) {
      try {
          const u = turf.union(turf.featureCollection([w1.toGeoJSON(), w2.toGeoJSON()]));
          if (u) {
              const fid = w1.feature?.properties?.frakcja;
              w1.remove(); w2.remove();
              const nl = L.geoJSON(u).addTo(map);
              
              nl.getLayers().forEach(nk => {
                  nk.options.pmIgnore = false;
                  L.PM.reInitLayer(nk);
                  dodajEdycjeIKlikanie(nk);
                  const nazwa = prompt("Aneksja zakończona! Podaj nazwę nowego terytorium:");
                  nk.feature = nk.feature || { type: "Feature", properties: {} };
                  if (fid) zastosujFrakcje(nk, fid);
                  if (nazwa) {
                      nk.feature.properties.name = nazwa;
                      nk.bindTooltip(nazwa, { permanent: nazwyPermanentne, sticky: !nazwyPermanentne, direction: 'center', className: "text-white font-bold text-[10px] uppercase tracking-wider bg-tactical-900/80 border border-tactical-500 px-2 py-1 rounded shadow-lg pointer-events-none" });
                  }
              });
              zapiszStan();
          }
      } catch (err) {
          [w1, w2].forEach(w => { const id = w.feature?.properties?.frakcja; id ? zastosujFrakcje(w, id) : w.setStyle({ color: '#3388ff' }); });
      }
    }

    const ZDARZENIA_EDYCJI = 'pm:edit pm:markerdrag pm:drag pm:vertexadded pm:vertexremoved';
    function stylujStrzalke(layer, kolor = '#10b981') {
      layer.feature = layer.feature || { type: "Feature", properties: {} };
      layer.feature.properties.isArrow = true;
      layer.feature.properties.color = kolor;
      layer.setStyle({ color: kolor, weight: 4, dashArray: '10, 10' });

      if (layer._grot) map.removeLayer(layer._grot);
      if (layer._odswiezGrot) layer.off(ZDARZENIA_EDYCJI, layer._odswiezGrot);
      if (layer._usunGrot) layer.off('remove', layer._usunGrot);

      layer._grot = L.polylineDecorator(layer, { patterns: [{ offset: '100%', repeat: 0, symbol: L.Symbol.arrowHead({ pixelSize: 18, polygon: true, pathOptions: { color: kolor, fillColor: kolor, fillOpacity: 1, weight: 2, pmIgnore: true } }) }] }).addTo(map);
      layer._odswiezGrot = () => layer._grot && layer._grot.setPaths(layer.getLatLngs());
      layer._usunGrot = () => { if (layer._grot) map.removeLayer(layer._grot); };
      layer.on(ZDARZENIA_EDYCJI, layer._odswiezGrot);
      layer.on('remove', layer._usunGrot);
    }

    function zastosujFrakcje(layer, id) {
      const f = frakcje[id];
      if (!f) return;
      layer.feature = layer.feature || { type: "Feature", properties: {} };
      layer.feature.properties.frakcja = id;

      if (layer instanceof L.Marker) {
          if (layer.feature.properties.iconType) zastosujIkone(layer, layer.feature.properties.iconType, layer.feature.properties.iconUrl);
      } else if (layer.feature.properties.isArrow && layer instanceof L.Polyline) {
          stylujStrzalke(layer, f.kolor);
      } else if (layer instanceof L.Polygon) {
          layer.setStyle({ color: f.kolor, fillColor: f.kolor, fillOpacity: 0.35, weight: 2 });
      } else if (layer instanceof L.Polyline) {
          layer.setStyle({ color: f.kolor });
      }
    }

    let oczekujacyMarker = null;
    map.on('pm:create', (e) => {
      const layer = e.layer;
      layer.feature = layer.feature || { type: "Feature", properties: {} };

      if (e.shape === 'Marker') {
          layer.feature.properties.frakcja = aktywnaFrakcja; 
          oczekujacyMarker = layer;
          document.getElementById('icon-modal').style.display = 'flex';
      } else if (e.shape === 'Line') {
          if (trybRysowaniaStrzalki) { layer.feature.properties.isArrow = true; trybRysowaniaStrzalki = false; }
          zastosujFrakcje(layer, aktywnaFrakcja); dodajEdycjeIKlikanie(layer); zapiszStan();
      } else {
          zastosujFrakcje(layer, aktywnaFrakcja); dodajEdycjeIKlikanie(layer); zapiszStan();
      }
    });

    window.wybierzIkone = function (typ) { zastosujIkone(oczekujacyMarker, typ, null); zamknijModalIDokoncz(); }
    window.anulujDodawanie = function () { document.getElementById('icon-modal').style.display = 'none'; if (oczekujacyMarker) { map.removeLayer(oczekujacyMarker); oczekujacyMarker = null; } }
    
    function zastosujIkone(layer, typ, url) {
      layer.feature = layer.feature || { type: "Feature", properties: {} };
      layer.feature.properties.iconType = typ;
      if (url) layer.feature.properties.iconUrl = url;

      let iconClass = 'fa-solid fa-location-dot';
      let size = 32; let fontSize = 14; let offset = -16; let extraStyles = "";

      switch(typ) {
          case 'army': iconClass = 'fa-solid fa-shield-halved'; break;
          case 'cavalry': iconClass = 'fa-solid fa-horse-head'; break;
          case 'corps': iconClass = 'fa-solid fa-cubes'; break;
          case 'fortress': iconClass = 'fa-brands fa-fort-awesome'; break;
          case 'front': iconClass = 'fa-solid fa-flag'; break;
          case 'garrison': iconClass = 'fa-solid fa-building-shield'; break;
          case 'group': iconClass = 'fa-solid fa-people-group'; break;
          case 'naval': iconClass = 'fa-solid fa-anchor'; break;
          case 'battle': iconClass = 'fa-solid fa-explosion'; size = 50; fontSize = 24; offset = -25; break;
      }

      let icon;
      if (typ === 'custom') {
          icon = L.icon({ iconUrl: url, iconSize: [40, 40], iconAnchor: [20, 20] });
      } else {
          let kolor = frakcje[layer.feature.properties.frakcja]?.kolor || '#888';
          let textColor = "white";
          
          if (typ === 'battle') {
              extraStyles = `box-shadow: 0 0 20px ${kolor}, inset 0 0 10px rgba(0,0,0,0.5);`; textColor = "#fca5a5"; 
          }

          icon = L.divIcon({
              html: `<div style="width:${size}px;height:${size}px;margin:${offset}px 0 0 ${offset}px;display:flex;align-items:center;justify-content:center;font-size:${fontSize}px;background:#262730;border:3px solid ${kolor};border-radius:50%;color:${textColor};${extraStyles}"><i class="${iconClass}"></i></div>`,
              className: 'custom-div-icon shadow-lg'
          });
      }
      layer.setIcon(icon);
    }

    function zamknijModalIDokoncz() {
      document.getElementById('icon-modal').style.display = 'none';
      
      const isBattle = oczekujacyMarker.feature.properties.iconType === 'battle';
      const promptTxt = isBattle ? "Podaj Kryptonim / Nazwę Bitwy:" : "Podaj nazwę dla tej jednostki:";
      const nazwa = prompt(promptTxt);
      
      if (nazwa) {
          oczekujacyMarker.feature.properties.name = nazwa;
          
          if (isBattle) {
              const desc = prompt("Podaj krótki opis bitwy:");
              const res = prompt("Podaj wynik bitwy (np. Zwycięstwo osi, Odwrót):");
              oczekujacyMarker.feature.properties.description = desc || "";
              oczekujacyMarker.feature.properties.result = res || "";
          }

          oczekujacyMarker.bindTooltip(nazwa, { permanent: nazwyPermanentne, sticky: !nazwyPermanentne, direction: 'center', className: "text-white font-bold text-[10px] uppercase tracking-wider bg-tactical-900/80 border border-tactical-500 px-2 py-1 rounded shadow-lg pointer-events-none" });
      }
      dodajEdycjeIKlikanie(oczekujacyMarker);
      zapiszStan();
      oczekujacyMarker = null;
    }

    map.on('pm:remove', () => zapiszStan());
    map.on('pm:cut', (e) => { e.layer.getLayers().forEach(nk => dodajEdycjeIKlikanie(nk)); zapiszStan(); });
    
    document.getElementById('draw-arrow-btn').addEventListener('click', () => { trybRysowaniaStrzalki = true; map.pm.enableDraw('Line', { snappable: false }); });
    document.getElementById('toggle-names-btn').addEventListener('click', () => {
        nazwyPermanentne = !nazwyPermanentne;
        const btn = document.getElementById('toggle-names-btn');
        btn.classList.toggle('bg-tactical-accent', nazwyPermanentne); btn.classList.toggle('border-tactical-accent', nazwyPermanentne);
        
        map.pm.getGeomanLayers().forEach(layer => {
            const props = layer.feature?.properties; const nazwa = props?.name || props?.NAME || props?.SUBJECTO;
            if(nazwa) {
                layer.unbindTooltip(); layer.bindTooltip(nazwa, { permanent: nazwyPermanentne, sticky: !nazwyPermanentne, direction: 'center', className: "text-white font-bold text-[10px] uppercase tracking-wider bg-tactical-900/80 border border-tactical-500 px-2 py-1 rounded shadow-lg pointer-events-none" });
            }
        });
    });

    // 7. Zarządzanie Panelem Frakcji
    const selectFrakcji = document.getElementById('frakcja-select');
    const kolorInput = document.getElementById('frakcja-kolor');
    const malujBtn = document.getElementById('maluj-btn');

    function odswiezListeFrakcji() {
      selectFrakcji.innerHTML = '';
      for (const [id, f] of Object.entries(frakcje)) {
          const opt = document.createElement('option'); opt.value = id; opt.textContent = f.nazwa; selectFrakcji.appendChild(opt);
      }
      if(!frakcje[aktywnaFrakcja]) aktywnaFrakcja = Object.keys(frakcje)[0];
      selectFrakcji.value = aktywnaFrakcja;
      if(frakcje[aktywnaFrakcja]) kolorInput.value = frakcje[aktywnaFrakcja].kolor;
    }
    
    selectFrakcji.addEventListener('change', () => { aktywnaFrakcja = selectFrakcji.value; kolorInput.value = frakcje[aktywnaFrakcja].kolor; });
    kolorInput.addEventListener('input', () => {
      frakcje[aktywnaFrakcja].kolor = kolorInput.value;
      map.pm.getGeomanLayers().forEach(l => { if (l.feature?.properties?.frakcja === aktywnaFrakcja) zastosujFrakcje(l, aktywnaFrakcja); });
    });
    kolorInput.addEventListener('change', () => { zapiszStan(); autozapis(); });
    
    document.getElementById('dodaj-frakcje-btn').addEventListener('click', () => {
      const nazwa = prompt("Nazwa nowej frakcji:"); if (!nazwa) return;
      const id = crypto.randomUUID(); 
      const losowy = '#' + Math.floor(Math.random() * 0xffffff).toString(16).padStart(6, '0');
      frakcje[id] = { nazwa, kolor: losowy }; aktywnaFrakcja = id;
      odswiezListeFrakcji(); autozapis();
    });

    malujBtn.addEventListener('click', () => {
      trybMalowania = !trybMalowania;
      malujBtn.innerHTML = trybMalowania ? '<i class="fa-solid fa-fill-drip"></i> Malowanie: WŁ.' : '<i class="fa-solid fa-fill-drip"></i> Malowanie: Wył.';
      malujBtn.classList.toggle('bg-tactical-accent', trybMalowania);
      document.getElementById('map').style.cursor = trybMalowania ? 'crosshair' : '';
    });

    // 8. Oś Czasu
    const suwak = document.getElementById('czas-suwak');
    const etykieta = document.getElementById('czas-etykieta');
    const znaczniki = document.getElementById('czas-znaczniki');
    const playBtn = document.getElementById('czas-play');
    
    function najblizszaKlatka(t) { let wynik = null; for (const k of Object.keys(klatki)) { const n = Number(k); if (n <= t && (wynik === null || n > wynik)) wynik = n; } return wynik; }
    
    function zapiszKlatke(stan) {
      const klucz = najblizszaKlatka(czasTeraz);
      const dokladna = klucz === czasTeraz;
      const poprzednia = klucz !== null ? klatki[klucz] : { features: [] };
      const taSama = JSON.stringify(poprzednia.features) === JSON.stringify(stan.features);
      if (dokladna || !taSama) { klatki[czasTeraz] = stan; autozapis(); odswiezZnaczniki(); odswiezEtykiete(); }
    }

    function autozapis() { try { localStorage.setItem('kampania-autozapis-'+BATTLE_ID, JSON.stringify({ frakcje, klatki, rozkazy: lokalneRozkazy })); } catch (e) {} }
    
    function odswiezEtykiete() {
      const t = new Date(czasTeraz).toLocaleString('pl-PL', { timeZone: 'UTC', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
      const jestKlatka = najblizszaKlatka(czasTeraz) === czasTeraz;
      etykieta.innerHTML = t + (jestKlatka ? ' <span class="text-red-400 text-xs">● klatka</span>' : '');
    }
    
    function odswiezZnaczniki() {
      znaczniki.innerHTML = ''; const zakres = CZAS_KONIEC - CZAS_START;
      for (const k of Object.keys(klatki)) {
          const proc = ((Number(k) - CZAS_START) / zakres) * 100;
          if (proc >= 0 && proc <= 100) {
              const d = document.createElement('div');
              d.className = "absolute top-0 w-[3px] h-3 bg-red-500 rounded";
              d.style.left = `${proc}%`; d.style.marginLeft = "-1px";
              znaczniki.appendChild(d);
          }
      }
    }
    
    function ustawCzas(t) {
      czasTeraz = Math.min(CZAS_KONIEC, Math.max(CZAS_START, t));
      wybraneDoAneksji = [];
      const klucz = najblizszaKlatka(czasTeraz);
      const stan = klucz !== null ? klatki[klucz] : null;
      odtworzStan(stan);
      historiaMapy = [{ type: "FeatureCollection", features: stan ? stan.features : [] }];
      suwak.value = Math.round((czasTeraz - CZAS_START) / GODZINA);
      odswiezEtykiete();
    }

    suwak.addEventListener('input', () => ustawCzas(CZAS_START + Number(suwak.value) * GODZINA));
    document.getElementById('czas-wstecz').addEventListener('click', () => ustawCzas(czasTeraz - GODZINA));
    document.getElementById('czas-dalej').addEventListener('click', () => ustawCzas(czasTeraz + GODZINA));
    document.getElementById('czas-dzien-wstecz').addEventListener('click', () => ustawCzas(czasTeraz - 24 * GODZINA));
    document.getElementById('czas-dzien-dalej').addEventListener('click', () => ustawCzas(czasTeraz + 24 * GODZINA));
    document.getElementById('czas-usun-klatke').addEventListener('click', () => { if (klatki[czasTeraz]) { delete klatki[czasTeraz]; autozapis(); odswiezZnaczniki(); ustawCzas(czasTeraz); } });

    let timerPlay = null;
    playBtn.addEventListener('click', () => {
      if (timerPlay) { clearInterval(timerPlay); timerPlay = null; playBtn.innerHTML = '<i class="fa-solid fa-play"></i> Odtwórz'; playBtn.classList.remove('text-tactical-accent','border-tactical-accent'); return; }
      playBtn.innerHTML = '<i class="fa-solid fa-pause"></i> Pauza'; playBtn.classList.add('text-tactical-accent','border-tactical-accent');
      timerPlay = setInterval(() => {
          if (czasTeraz >= CZAS_KONIEC) { clearInterval(timerPlay); timerPlay = null; playBtn.innerHTML = '<i class="fa-solid fa-play"></i> Odtwórz'; playBtn.classList.remove('text-tactical-accent'); return; }
          ustawCzas(czasTeraz + GODZINA);
      }, 300);
    });

    // 9. Import / Export Local
    document.getElementById('export-btn').addEventListener('click', () => {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({ format: "kampania-v2", frakcje, klatki, rozkazy: lokalneRozkazy }));
      const a = document.createElement('a'); a.href = dataStr; a.download = `kampania_${BATTLE_ID}.json`; document.body.appendChild(a); a.click(); a.remove();
    });
    
    document.getElementById('import-btn').addEventListener('click', () => document.getElementById('import-input').click());
    document.getElementById('import-input').addEventListener('change', (e) => {
      const file = e.target.files[0]; if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
          try {
              const d = JSON.parse(e.target.result);
              if (d.frakcje || d.klatki) { 
                  if (d.frakcje) { Object.assign(frakcje, d.frakcje); odswiezListeFrakcji(); }
                  if (d.rozkazy) { lokalneRozkazy = d.rozkazy; }
                  if (d.klatki) { klatki = d.klatki; naprawRelacjeFrakcji(); autozapis(); odswiezZnaczniki(); ustawCzas(czasTeraz); }
              } else if (d.type === "FeatureCollection" || d.features) {
                  const obecne = map.pm.getGeomanLayers().map(l => l.toGeoJSON());
                  odtworzStan({ type: "FeatureCollection", features: [...obecne, ...d.features] });
                  zapiszStan();
                  const tempLayer = L.geoJSON(d); map.fitBounds(tempLayer.getBounds());
              }
          } catch(err) { alert("Niepoprawny plik JSON: " + err.message); }
      };
      reader.readAsText(file); e.target.value = ''; 
    });

    // 10. ZAPIS DO BAZY SUPABASE
    document.getElementById('export-db-btn').addEventListener('click', async () => {
      if (Object.keys(klatki).length === 0) return alert("Brak klatek do eksportu!");
      const btn = document.getElementById('export-db-btn');
      btn.innerHTML = "<i class='fa-solid fa-spinner fa-spin'></i> Wysyłanie..."; btn.classList.add("bg-yellow-600");

      const isValidUUID = (uuid) => /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(uuid);

      try {
          const czysteFrakcje = {};
          for (const [oldKey, f] of Object.entries(frakcje)) {
              let safeKey = oldKey;
              if (!isValidUUID(safeKey)) {
                  safeKey = crypto.randomUUID(); 
                  for (const stan of Object.values(klatki)) {
                      if (!stan.features) continue;
                      for (const feature of stan.features) {
                          if (feature.properties && feature.properties.frakcja === oldKey) { feature.properties.frakcja = safeKey; }
                      }
                  }
              }
              czysteFrakcje[safeKey] = f;
          }
          frakcje = czysteFrakcje;
          odswiezListeFrakcji();

          for (const [key, f] of Object.entries(frakcje)) {
              const { error: sideErr } = await db.from('sides').upsert({ id: key, campaigns_id: BATTLE_ID, name: f.nazwa, color: f.kolor });
              if (sideErr) throw new Error("Błąd zapisu frakcji: " + sideErr.message);
          }

          const aktywneJednostki = new Set();
          for (const stan of Object.values(klatki)) {
              if (!stan.features) continue;
              for (const feature of stan.features) {
                  if (feature.geometry.type === 'Point' && feature.properties?.name && feature.properties?.iconType !== 'battle') {
                      aktywneJednostki.add(feature.properties.name);
                  }
              }
          }

          const { data: dbUnits } = await db.from('units').select('id, name').eq('campaigns_id', BATTLE_ID);
          const dbUnitIds = dbUnits ? dbUnits.map(u => u.id) : [];

          if (dbUnitIds.length > 0) {
              await db.from('unit_positions').delete().in('unit_id', dbUnitIds);
              await db.from('orders').delete().in('unit_id', dbUnitIds);
          }

          if (dbUnits) {
              const unitsToDelete = dbUnits.filter(u => !aktywneJednostki.has(u.name)).map(u => u.id);
              if (unitsToDelete.length > 0) { await db.from('units').delete().in('id', unitsToDelete); }
          }

          const unitsMap = new Map();
          if (dbUnits) {
              dbUnits.forEach(u => { if (aktywneJednostki.has(u.name)) unitsMap.set(u.name, u.id); });
          }

          const battlesMap = new Map();
          const pozycjeDoBazy = [];
          const graniceWKlatkach = {};

          for (const [timestamp, stan] of Object.entries(klatki)) {
              const recordedAt = new Date(Number(timestamp)).toISOString();
              const sameGranice = [];

              for (const feature of stan.features) {
                  const typ = feature.geometry.type;
                  const props = feature.properties || {};
                  
                  if (typ === 'Polygon' || typ === 'MultiPolygon') sameGranice.push(feature);
                  
                  if (typ === 'Point' && props.name) {
                      
                      // ZAPIS BITWY
                      if (props.iconType === 'battle') {
                          sameGranice.push(feature); 

                          if (!battlesMap.has(props.name)) {
                              let { data: existingBattle, error: checkErr } = await db.from('battles')
                                  .select('id')
                                  .eq('name', props.name)
                                  .maybeSingle();

                              const battleData = {
                                  name: props.name,
                                  description: props.description || '',
                                  result: props.result || '',
                                  latitude: feature.geometry.coordinates[1],
                                  longitude: feature.geometry.coordinates[0],
                                  start_date: recordedAt 
                              };

                              if (existingBattle && existingBattle.id) {
                                  await db.from('battles').update(battleData).eq('id', existingBattle.id);
                              } else {
                                  await db.from('battles').insert(battleData);
                              }
                              battlesMap.set(props.name, true);
                          }
                      } 
                      // ZAPIS JEDNOSTEK
                      else {
                          let unitId;
                          if (!unitsMap.has(props.name)) {
                              const sideId = props.frakcja && frakcje[props.frakcja] ? props.frakcja : Object.keys(frakcje)[0];
                              
                              let { data: existingUnit, error: checkErr } = await db.from('units')
                                  .select('id')
                                  .eq('campaigns_id', BATTLE_ID)
                                  .eq('name', props.name)
                                  .maybeSingle();

                              if (checkErr) throw new Error("Błąd weryfikacji jednostki: " + checkErr.message);

                              if (existingUnit && existingUnit.id) {
                                  unitId = existingUnit.id;
                              } else {
                                  const { data: newUnit, error: unitErr } = await db.from('units').insert({
                                      campaigns_id: BATTLE_ID, side_id: sideId, name: props.name, unit_type: props.iconType || 'infantry', symbol: props.iconType || 'none'
                                  }).select('id').single();
                                  
                                  if (unitErr) throw new Error("Błąd dodawania jednostki: " + unitErr.message);
                                  unitId = newUnit.id; 
                              }
                              unitsMap.set(props.name, unitId);
                          } else { 
                              unitId = unitsMap.get(props.name); 
                          }

                          pozycjeDoBazy.push({ unit_id: unitId, recorded_at: recordedAt, longitude: feature.geometry.coordinates[0], latitude: feature.geometry.coordinates[1], heading: 0, strength: 1000 });
                      }
                  }
              }
              graniceWKlatkach[timestamp] = sameGranice;
          }

          if (pozycjeDoBazy.length > 0) {
              const { error: posErr } = await db.from('unit_positions').insert(pozycjeDoBazy);
              if (posErr) throw new Error("Błąd zapisu pozycji: " + posErr.message);
          }

          // ZAPIS ROZKAZÓW Z PAMIĘCI
          if (lokalneRozkazy.length > 0) {
              const dbOrders = [];
              for (const r of lokalneRozkazy) {
                  const uId = unitsMap.get(r.unitName);
                  if (uId) {
                      dbOrders.push({
                          unit_id: uId,
                          issued_at: r.issued_at,
                          valid_from: r.valid_from,
                          order_type: r.order_type,
                          description: r.description,
                          target_latitude: r.target_latitude,
                          target_longitude: r.target_longitude
                      });
                  }
              }
              if (dbOrders.length > 0) {
                  const { error: ordErr } = await db.from('orders').insert(dbOrders);
                  if (ordErr) throw new Error("Błąd zapisu rozkazów: " + ordErr.message);
              }
          }
          
          const { error: campErr } = await db.from('campaigns').update({ map_config: { borders_timeline: graniceWKlatkach } }).eq('id', BATTLE_ID);
          if (campErr) throw new Error("Błąd aktualizacji kampanii: " + campErr.message);

          btn.innerHTML = "<i class='fa-solid fa-check'></i> Zapisano"; btn.classList.replace("bg-yellow-600", "bg-green-600");
          autozapis(); 
          setTimeout(() => { btn.innerHTML = "<i class='fa-solid fa-cloud-arrow-up'></i> Zapisz do Bazy"; btn.classList.remove("bg-green-600"); }, 3000);
      } catch (err) {
          console.error("Szczegóły błędu:", err);
          alert(err.message); 
          btn.innerHTML = "❌ Błąd"; 
          btn.classList.replace("bg-yellow-600", "bg-red-600");
      }
    });

    document.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'z') {
          if (historiaMapy.length > 1) {
              historiaMapy.pop();
              const poprzedni = historiaMapy[historiaMapy.length - 1]; odtworzStan(poprzedni); zapiszKlatke(poprzedni);
          }
      }
    });
  </script>
</body>
