<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wybór bitwy</title>
    
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 576 512'%3E%3Cpath fill='%2310b981' d='M384 476.1L192 421.2l-148.2 49.4C19.7 478.7 0 460.6 0 435.5V107.5c0-18.7 12.8-35 30.9-39.5l161.1-40.3 192 54.9 148.2-49.4c24.1-8 43.8 10.1 43.8 35.2v328c0 18.7-12.8 35-30.9 39.5L384 476.1zm-96-368.6c-44.2 0-80 35.8-80 80c0 40.8 66.8 126.9 74.4 136.6c2.8 3.6 8.3 3.6 11.2 0c7.6-9.7 74.4-95.8 74.4-136.6c0-44.2-35.8-80-80-80zm0 112a32 32 0 1 1 0-64 32 32 0 1 1 0 64z'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              tactical: { 950: '#090a0f', 900: '#0f1015', 800: '#181920', 700: '#262730', 600: '#3b3d4a', accent: '#10b981', accentHover: '#059669' }
            }
          }
        }
      }
    </script>
  </head>
  <body class="bg-tactical-950 text-slate-300 font-sans min-h-screen relative">
    
    <nav class="border-b border-tactical-700 bg-tactical-900 px-6 py-4 flex flex-col md:flex-row justify-between items-center gap-4 sticky top-0 z-40">
      <a href="index.html" class="flex items-center gap-3 text-slate-400 hover:text-white transition-colors">
        <i class="fa-solid fa-arrow-left"></i> Powrót do menu
      </a>
      <div class="font-bold text-white text-lg flex items-center gap-2">
        <i class="fa-solid fa-database text-tactical-accent"></i> Baza Danych Konfliktów
      </div>
      <div>
        <button onclick="otworzModalBitwy()" class="px-4 py-2 bg-tactical-accent hover:bg-tactical-accentHover text-white rounded-lg text-sm font-bold transition-colors shadow-lg shadow-tactical-accent/20">
          <i class="fa-solid fa-plus mr-1"></i> Utwórz nową bitwę
        </button>
      </div>
    </nav>

    <main class="max-w-5xl mx-auto px-4 py-8 relative z-10">
      <div class="bg-tactical-900 p-4 rounded-lg border border-tactical-700 mb-6 flex flex-col md:flex-row gap-4 justify-between items-center">
        <div class="relative w-full md:w-1/2">
          <i class="fa-solid fa-search absolute left-3 top-3 text-slate-500"></i>
          <input type="text" placeholder="Szukaj bitwy..." class="w-full bg-tactical-950 border border-tactical-700 rounded-md py-2 pl-10 pr-4 text-white focus:outline-none focus:border-tactical-accent transition-colors">
        </div>
      </div>
      
      <div id="campaigns-list" class="space-y-4">
        <div class="text-center py-16 text-slate-500">
          <i class="fa-solid fa-circle-notch fa-spin text-4xl mb-4 text-tactical-accent"></i>
          <p class="text-lg">Trwa łączenie z dowództwem (Supabase)...</p>
        </div>
      </div>
    </main>

    <!-- Nowy Modal Tworzenia Bitwy -->
    <div id="create-battle-modal" class="fixed inset-0 bg-black/80 z-[9999] hidden justify-center items-center backdrop-blur-sm">
      <div class="bg-tactical-900 border border-tactical-700 rounded-xl p-6 shadow-2xl max-w-md w-full mx-4 relative transform transition-all">
        <button onclick="zamknijModalBitwy()" class="absolute top-4 right-4 text-slate-500 hover:text-white transition-colors">
          <i class="fa-solid fa-times text-xl"></i>
        </button>
        
        <h3 class="text-xl font-bold text-white mb-5 border-b border-tactical-700 pb-3 flex items-center gap-2">
          <i class="fa-solid fa-plus-square text-tactical-accent"></i> Konfiguracja Nowej Operacji
        </h3>
        
        <form id="create-battle-form" class="space-y-4">
          <div>
            <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Kryptonim (Nazwa)</label>
            <input type="text" id="b-name" required placeholder="np. Kampania Wrześniowa" class="w-full bg-tactical-950 border border-tactical-700 rounded p-2.5 text-white focus:border-tactical-accent focus:ring-1 focus:ring-tactical-accent focus:outline-none transition-all">
          </div>
          
          <div>
            <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Opis Operacji</label>
            <textarea id="b-desc" rows="3" placeholder="Krótkie streszczenie celów strategicznych..." class="w-full bg-tactical-950 border border-tactical-700 rounded p-2.5 text-white focus:border-tactical-accent focus:ring-1 focus:ring-tactical-accent focus:outline-none transition-all"></textarea>
          </div>
          
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Czas Startu</label>
              <input type="datetime-local" id="b-start" required class="w-full bg-tactical-950 border border-tactical-700 rounded p-2 text-white focus:border-tactical-accent focus:outline-none text-sm [color-scheme:dark]">
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Czas Zakończenia</label>
              <input type="datetime-local" id="b-end" required class="w-full bg-tactical-950 border border-tactical-700 rounded p-2 text-white focus:border-tactical-accent focus:outline-none text-sm [color-scheme:dark]">
            </div>
          </div>

          <div class="pt-4 border-t border-tactical-700 mt-6">
            <button type="submit" class="w-full py-3 bg-tactical-accent hover:bg-tactical-accentHover text-white rounded-lg font-bold transition-all shadow-[0_0_15px_rgba(16,185,129,0.15)] flex justify-center items-center gap-2">
              <i class="fa-solid fa-satellite-dish"></i> Zapisz i otwórz Edytor
            </button>
          </div>
        </form>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
      const SUPABASE_URL = 'https://pdshnuybcijmotizpgxy.supabase.co';
      const SUPABASE_KEY = 'sb_publishable_Q8cmNNSUVGzlSoev2GK-Gg_CiKxQkth';
      const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

      async function fetchcampaigns() {
        const container = document.getElementById('campaigns-list');
        try {
          const { data: campaigns, error } = await db.from('campaigns').select('*').order('start_time', { ascending: true });
          if (error) throw error;
          
          if (!campaigns || campaigns.length === 0) {
            container.innerHTML = `
              <div class="bg-tactical-900 border border-tactical-700 text-slate-400 p-12 rounded-lg text-center shadow-lg">
                <h3 class="text-xl font-bold text-white mb-2">Brak danych operacyjnych</h3>
                <p>W bazie danych nie znaleziono żadnych bitew.</p>
              </div>`;
            return;
          }

          const formatDateTime = (dateStr) => {
            if (!dateStr) return 'Brak daty';
            const d = new Date(dateStr);
            return d.toLocaleDateString('pl-PL') + ' ' + d.toLocaleTimeString('pl-PL', { hour: '2-digit', minute: '2-digit' });
          };

          container.innerHTML = campaigns.map(battle => `
            <div class="bg-tactical-900 border border-tactical-700 rounded-lg p-5 hover:border-tactical-accent transition-colors flex flex-col md:flex-row justify-between items-center gap-4 group">
              <div class="flex-1">
                <div class="flex items-center gap-3 mb-1">
                  <span class="bg-tactical-800 text-tactical-accent text-xs px-2 py-1 rounded font-bold border border-tactical-700 uppercase tracking-wider">Scenariusz</span>
                  <h3 class="text-xl font-bold text-white group-hover:text-tactical-accent transition-colors">${battle.name}</h3>
                </div>
                <p class="text-sm text-slate-400 line-clamp-2 mb-3 mt-2">${battle.description || 'Brak opisu taktycznego.'}</p>
                <div class="text-xs text-slate-500 flex items-center gap-4">
                  <span class="flex items-center gap-1.5"><i class="fa-regular fa-clock text-tactical-600"></i> Od: <span class="text-slate-300 font-mono">${formatDateTime(battle.start_time)}</span></span>
                  <span class="flex items-center gap-1.5"><i class="fa-solid fa-flag-checkered text-tactical-600"></i> Do: <span class="text-slate-300 font-mono">${formatDateTime(battle.end_time)}</span></span>
                </div>
              </div>
              <div class="flex flex-col sm:flex-row gap-3 w-full md:w-auto shrink-0 mt-4 md:mt-0">
                <a href="edytor.html?battle_id=${battle.id}" class="flex-1 md:flex-none text-center px-4 py-2.5 bg-tactical-800 border border-tactical-700 hover:bg-tactical-700 hover:text-white rounded-lg text-slate-300 text-sm font-medium transition-all flex items-center justify-center gap-2">
                  <i class="fa-solid fa-pen"></i> Edytuj
                </a>
                <a href="wizualizacja.html?battle_id=${battle.id}" class="flex-1 md:flex-none text-center px-6 py-2.5 bg-tactical-accent hover:bg-tactical-accentHover text-white rounded-lg text-sm font-bold shadow-[0_0_15px_rgba(16,185,129,0.15)] transition-all flex items-center justify-center gap-2">
                  <i class="fa-solid fa-play"></i> Wizualizacja
                </a>
              </div>
            </div>
          `).join('');

        } catch (err) {
          container.innerHTML = `<div class="bg-red-900/20 text-red-400 p-6 rounded-lg text-center">Błąd: ${err.message}</div>`;
        }
      }

      // Funkcje obsługi modala
      function otworzModalBitwy() {
        document.getElementById('create-battle-modal').classList.remove('hidden');
        document.getElementById('create-battle-modal').classList.add('flex');
      }

      function zamknijModalBitwy() {
        document.getElementById('create-battle-modal').classList.add('hidden');
        document.getElementById('create-battle-modal').classList.remove('flex');
      }

      // Nasłuchiwanie na wysłanie formularza
      document.getElementById('create-battle-form').addEventListener('submit', async (e) => {
        e.preventDefault(); // Zatrzymuje przeładowanie strony
        
        const name = document.getElementById('b-name').value;
        const desc = document.getElementById('b-desc').value;
        const startStr = document.getElementById('b-start').value;
        const endStr = document.getElementById('b-end').value;

        const btn = e.target.querySelector('button[type="submit"]');
        const originalText = btn.innerHTML;
        btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Zapisywanie...';
        btn.disabled = true;

        try {
          // Konwersja czasu lokalnego na format ISO (wymagany przez bazy danych)
          const start_time = new Date(startStr).toISOString();
          const end_time = new Date(endStr).toISOString();

          // Zabezpieczenie przed cofaniem się w czasie
          if (new Date(start_time) >= new Date(end_time)) {
            alert("Błąd: Czas zakończenia operacji musi być późniejszy niż czas rozpoczęcia!");
            btn.innerHTML = originalText;
            btn.disabled = false;
            return;
          }

          // Zapis do Supabase
          const { data, error } = await db.from('campaigns').insert({
            name: name,
            description: desc,
            start_time: start_time,
            end_time: end_time,
            map_config: {}
          }).select().single();

          if (error) throw error;
          
          // Przekierowanie do nowo wygenerowanego ID w edytorze
          window.location.href = `edytor.html?battle_id=${data.id}`;
        } catch (err) {
          alert("Wystąpił błąd przy tworzeniu bitwy: " + err.message);
          btn.innerHTML = originalText;
          btn.disabled = false;
        }
      });

      // Ukrywanie modala przy kliknięciu w szare tło (poza oknem)
      document.getElementById('create-battle-modal').addEventListener('click', (e) => {
        if (e.target.id === 'create-battle-modal') zamknijModalBitwy();
      });

      document.addEventListener('DOMContentLoaded', fetchcampaigns);
    </script>
  </body>
</html>
