<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wizualizacja Taktyczna</title>

  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 576 512'%3E%3Cpath fill='%2310b981' d='M384 476.1L192 421.2l-148.2 49.4C19.7 478.7 0 460.6 0 435.5V107.5c0-18.7 12.8-35 30.9-39.5l161.1-40.3 192 54.9 148.2-49.4c24.1-8 43.8 10.1 43.8 35.2v328c0 18.7-12.8 35-30.9 39.5L384 476.1zm-96-368.6c-44.2 0-80 35.8-80 80c0 40.8 66.8 126.9 74.4 136.6c2.8 3.6 8.3 3.6 11.2 0c7.6-9.7 74.4-95.8 74.4-136.6c0-44.2-35.8-80-80-80zm0 112a32 32 0 1 1 0-64 32 32 0 1 1 0 64z'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: { colors: { tactical: { 950: '#090a0f', 900: '#0f1015', 800: '#181920', 700: '#262730', 600: '#3b3d4a', accent: '#10b981', accentHover: '#059669' } } }
      }
    }
  </script>

  <style>
    /* Odwrócenie kafelków OSM na mroczny, radarowy klimat */
    .leaflet-tile { filter: brightness(0.6) invert(1) contrast(3) hue-rotate(200deg) saturate(0.3) brightness(0.7); }
    .leaflet-control-zoom { border: none !important; }
    .leaflet-control-zoom a { background-color: #181920 !important; color: #10b981 !important; border-color: #262730 !important; }

    /* Znaczniki jednostek */
    .unit-badge {
      width: 32px; height: 32px; box-sizing: border-box;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; color: #fff;
      background: #262730; border: 3px solid #888; border-radius: 50%;
      box-shadow: 0 0 10px rgba(0,0,0,0.8);
      position: relative;
      transition: transform 0.2s ease;
    }
    .unit-badge:hover { transform: scale(1.2); }
    .unit-badge.selected { box-shadow: 0 0 15px #10b981; outline: 2px solid #10b981; animation: pulse 1.5s infinite; }

    /* Wrak */
    .unit-badge.destroyed { background: #1f2937; border-color: #ef4444 !important; color: #6b7280; opacity: 0.7; }
    .unit-badge.destroyed::after {
      content: '✖'; color: #ef4444; font-size: 20px; font-weight: bold;
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    }
    
    /* Wybuch w chwili zniszczenia */
    .unit-badge.exploding {
      box-shadow: 0 0 20px 10px #ef4444, 0 0 40px 20px #f59e0b !important;
      background: #f59e0b !important; border-color: #ffffff !important; color: #fff;
    }

    /* Znacznik bitwy */
    .battle-badge {
      width: 50px; height: 50px; box-sizing: border-box;
      display: flex; align-items: center; justify-content: center;
      font-size: 24px; color: #fca5a5;
      background: #262730; border: 3px solid #ef4444; border-radius: 50%;
      cursor: pointer; transition: transform 0.2s ease;
    }
    .battle-badge:hover { transform: scale(1.15); }

    .map-tooltip {
      background: rgba(15,16,21,0.85) !important; color: #fff !important;
      border: 1px solid #3b3d4a !important; border-radius: 4px !important;
      font-size: 10px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase;
      padding: 3px 8px !important; box-shadow: 0 2px 8px rgba(0,0,0,0.6) !important;
    }
    .map-tooltip::before { display: none; }

    /* Płynna animacja dla wielokątów obszarów SVG na Leaflecie */

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
      70% { box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
      100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
    }
    @media (prefers-reduced-motion: reduce) { .unit-badge.selected { animation: none; } }
  </style>
</head>
<body class="bg-tactical-950 text-slate-300 font-sans h-screen flex flex-col overflow-hidden">

  <!-- Topbar -->
  <header class="h-14 bg-tactical-900 border-b border-tactical-700 flex justify-between items-center px-4 shrink-0 z-20 shadow-md">
    <div class="flex items-center gap-4 min-w-0">
      <a href="bitwy.html" class="text-slate-400 hover:text-white transition-colors" title="Wróć do bazy"><i class="fa-solid fa-arrow-left"></i></a>
      <h1 id="battle-title" class="text-white font-bold tracking-wide truncate">Ładowanie danych misji...</h1>
    </div>
    <div class="flex items-center gap-3 shrink-0">
      <span id="header-badge" class="hidden sm:inline text-xs font-bold text-blue-400 bg-blue-900/30 px-2 py-1 rounded border border-blue-500/30">Symulacja Przestrzenna Aktywna</span>
      <button id="toggle-names-btn" class="px-3 py-1.5 bg-tactical-800 hover:bg-tactical-700 border border-tactical-700 text-xs rounded transition-colors">
        <i class="fa-regular fa-eye"></i> <span class="hidden sm:inline">Pokaż/Ukryj Nazwy</span>
      </button>
    </div>
  </header>

  <div class="flex flex-1 overflow-hidden relative">
    <!-- Panel boczny -->
    <aside id="side-panel" class="w-80 bg-tactical-950 border-r border-tactical-700 flex flex-col shrink-0 overflow-y-auto z-30 transition-transform transform -translate-x-full absolute h-full sm:relative sm:translate-x-0 shadow-2xl">
      <div id="panel-content" class="p-6"></div>
      
    </aside>

    <!-- Mapa -->
    <main class="flex-1 relative bg-tactical-900" id="map-container">
      <div id="map" class="w-full h-full z-0"></div>
      <div id="legend" class="hidden absolute bottom-6 left-4 z-[1000] bg-tactical-900/90 border border-tactical-700 rounded-lg px-3 py-2 text-xs shadow-lg"></div>
    </main>
  </div>

  <!-- Pasek Osi Czasu -->
  <footer class="h-28 bg-tactical-900 border-t border-tactical-700 flex flex-col shrink-0 px-6 py-3 justify-center z-20 shadow-[0_-10px_15px_-3px_rgba(0,0,0,0.3)]">
    <div class="flex justify-between items-center text-xs text-slate-400 font-medium mb-2 gap-2">
      <span id="time-start" class="shrink-0">--</span>
      <span class="text-white font-bold text-sm bg-tactical-800 px-3 py-1 rounded border border-tactical-700 shadow-inner text-center">
        <i class="fa-solid fa-clock text-tactical-accent mr-1"></i> <span id="time-current">Ładowanie...</span>
        <span id="frame-flag" class="hidden text-red-400 text-xs ml-1">● klatka</span>
      </span>
      <span id="time-end" class="shrink-0">--</span>
    </div>
    <div class="flex items-center gap-3">
      <button id="btn-prev-frame" title="Poprzednia klatka" class="w-9 h-9 rounded-full bg-tactical-800 border border-tactical-700 hover:border-tactical-accent hover:text-tactical-accent text-slate-300 flex items-center justify-center transition-colors shrink-0">
        <i class="fa-solid fa-backward-step"></i>
      </button>
      <button id="btn-play" title="Odtwórz / Pauza" class="w-12 h-12 rounded-full bg-tactical-800 border border-tactical-700 hover:border-tactical-accent hover:text-tactical-accent text-white flex items-center justify-center transition-all shadow-lg shrink-0">
        <i class="fa-solid fa-play ml-1 text-xl"></i>
      </button>
      <button id="btn-next-frame" title="Następna klatka" class="w-9 h-9 rounded-full bg-tactical-800 border border-tactical-700 hover:border-tactical-accent hover:text-tactical-accent text-slate-300 flex items-center justify-center transition-colors shrink-0">
        <i class="fa-solid fa-forward-step"></i>
      </button>

      <div class="relative flex-1 pt-3">
        <div id="timeline-ticks" class="absolute top-0 left-0 w-full h-2 pointer-events-none"></div>
        <input type="range" id="timeline-slider" min="0" max="100" value="0" class="w-full h-2 bg-tactical-800 rounded-lg appearance-none cursor-pointer accent-tactical-accent">
      </div>

      <select id="speed-select" title="Szybkość odtwarzania" class="bg-tactical-800 text-white border border-tactical-600 rounded p-1 text-xs focus:outline-none focus:border-tactical-accent shrink-0">
        <option value="1">1 h/s</option>
        <option value="6">6 h/s</option>
        <option value="12" selected>12 h/s</option>
        <option value="24">1 d/s</option>
        <option value="72">3 d/s</option>
      </select>
    </div>
  </footer>

  <!-- Skrypty -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- Opcjonalny Turf.js jeśli potrzebny do interpolacji kształtów (użyjemy go do uproszczonego morfingu) -->
  <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>

  <script>
    var SUPABASE_URL = 'https://pdshnuybcijmotizpgxy.supabase.co';
    var SUPABASE_KEY = 'sb_publishable_Q8cmNNSUVGzlSoev2GK-Gg_CiKxQkth';
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    // ---------- Stałe i słowniki ----------
    const GODZINA = 3600000;
    const TICK_MS = 40; 
    const EXPLOSION_MS = 6 * GODZINA; 

    const ICONS = {
      army: 'fa-solid fa-shield-halved', cavalry: 'fa-solid fa-horse-head', corps: 'fa-solid fa-cubes',
      fortress: 'fa-brands fa-fort-awesome', front: 'fa-solid fa-flag', garrison: 'fa-solid fa-building-shield',
      group: 'fa-solid fa-people-group', naval: 'fa-solid fa-anchor', battle: 'fa-solid fa-explosion',
      infantry: 'fa-solid fa-person-rifle', armor: 'fa-solid fa-truck-monster', recon: 'fa-solid fa-binoculars'
    };
    const ORDER_LABELS = {
      move: 'Marsz / Przegrupowanie', attack: 'Atak', defend: 'Obrona', retreat: 'Odwrót', support: 'Wsparcie'
    };
    const TOOLTIP_CLASS = 'map-tooltip';

    // ---------- Stan ----------
    let campaign = null;
    let dataCache = { sides: [], units: [], positions: [], orders: [], events: [] };
    let sideById = new Map();
    let positionsByUnit = new Map(); 
    let destroyedAt = new Map(); 
    let removedAt = new Map(); // unit_id -> posortowane czasy zdarzeń 'removed' (jednostka usunięta w edytorze)
    let borderFrames = []; 
    let allFrameTimes = []; 
    let battleSpans = []; // bitwy z czasem trwania: { key, start, end, versions:[{t, ft}] }

    let map = null;
    let markers = {};
    let battlesLayer = null;
    let areasLayer = null; 
    
    // Zmienne do kontroli interpolacji obszarów
    let activePolygonsMap = new Map(); // name -> leafletLayer
    let lastRenderedTimeMs = -1;

    let targetLine = null;
    let selectedUnitId = null;
    let selectedBattle = null;
    let namesOn = false;
    let lastPanelHtml = '';

    let startTimeMs = 0, endTimeMs = 0, currentTimeMs = 0;
    let playTimer = null;

    // ---------- Start ----------
    async function init() {
      const params = new URLSearchParams(window.location.search);
      const campaignId = params.get('campaign_id') || params.get('battle_id');
      if (!campaignId) { alert('Nie wybrano kampanii!'); window.location.href = 'bitwy.html'; return; }

      renderEmptyPanel();
      try {
        await loadData(campaignId);
      } catch (err) {
        console.error(err);
        document.getElementById('battle-title').innerText = 'Błąd ładowania danych';
        document.getElementById('time-current').innerText = 'Brak danych';
        showFatal(err.message);
        return;
      }
      prepareData();
      setupMap();
      setupTimeline();
      renderLegend();
      updateVisuals();
    }

    // ---------- Pobieranie danych z Supabase ----------
    async function fetchAll(table, applyFilter) {
      const PAGE = 1000;
      let all = [];
      for (let from = 0; ; from += PAGE) {
        const { data, error } = await applyFilter(db.from(table).select('*'))
          .order('id', { ascending: true })
          .range(from, from + PAGE - 1);
        if (error) throw new Error(`Tabela ${table}: ${error.message}`);
        all = all.concat(data || []);
        if (!data || data.length < PAGE) break;
      }
      return all;
    }

    async function fetchByUnitIds(table, ids) {
      const CHUNK = 80; 
      const jobs = [];
      for (let i = 0; i < ids.length; i += CHUNK) {
        const part = ids.slice(i, i + CHUNK);
        jobs.push(fetchAll(table, q => q.in('unit_id', part)));
      }
      return (await Promise.all(jobs)).flat();
    }

    async function loadData(campaignId) {
      if (!db || typeof db.from !== 'function') throw new Error('Nie udało się połączyć z Supabase.');

      const { data: c, error: cErr } = await db.from('campaigns').select('*').eq('id', campaignId).maybeSingle();
      if (cErr) throw new Error('Tabela campaigns: ' + cErr.message);
      if (!c) throw new Error('Nie znaleziono kampanii o podanym ID.');
      campaign = c;
      document.getElementById('battle-title').innerText = campaign.name;
      document.title = campaign.name;

      const [sides, units] = await Promise.all([
        fetchAll('sides', q => q.eq('campaigns_id', campaignId)),
        fetchAll('units', q => q.eq('campaigns_id', campaignId))
      ]);
      dataCache.sides = sides;
      dataCache.units = units;

      const unitIds = units.map(u => u.id);
      if (unitIds.length > 0) {
        const [positions, orders, events] = await Promise.all([
          fetchByUnitIds('unit_positions', unitIds),
          fetchByUnitIds('orders', unitIds),
          fetchByUnitIds('unit_events', unitIds)
        ]);
        dataCache.positions = positions;
        dataCache.orders = orders;
        dataCache.events = events;
      }
    }

    // ---------- Przygotowanie danych do szybkiego odtwarzania ----------
    function prepareData() {
      sideById = new Map(dataCache.sides.map(s => [s.id, s]));

      positionsByUnit = new Map();
      dataCache.positions.forEach(p => {
        const t = new Date(p.recorded_at).getTime();
        if (!Number.isFinite(t)) return;
        if (!positionsByUnit.has(p.unit_id)) positionsByUnit.set(p.unit_id, []);
        positionsByUnit.get(p.unit_id).push({ ...p, t });
      });
      positionsByUnit.forEach(arr => arr.sort((a, b) => a.t - b.t));

      destroyedAt = new Map();
      dataCache.events.forEach(e => {
        if (e.event_type !== 'destroyed' && e.event_type !== 'eliminated') return;
        const t = new Date(e.occurred_at).getTime();
        if (!Number.isFinite(t)) return;
        if (!destroyedAt.has(e.unit_id) || t < destroyedAt.get(e.unit_id)) destroyedAt.set(e.unit_id, t);
      });

      removedAt = new Map();
      dataCache.events.forEach(e => {
        if (e.event_type !== 'removed') return;
        const t = new Date(e.occurred_at).getTime();
        if (!Number.isFinite(t)) return;
        if (!removedAt.has(e.unit_id)) removedAt.set(e.unit_id, []);
        removedAt.get(e.unit_id).push(t);
      });
      removedAt.forEach(arr => arr.sort((a, b) => a - b));

      let cfg = campaign.map_config;
      if (typeof cfg === 'string') { try { cfg = JSON.parse(cfg); } catch (e) { cfg = null; } }
      const timeline = (cfg && cfg.borders_timeline) || {};
      
      borderFrames = Object.entries(timeline)
        .map(([ts, f]) => ({ t: Number(ts), features: Array.isArray(f) ? f : (f && f.features) || [] }))
        .filter(f => Number.isFinite(f.t))
        .sort((a, b) => a.t - b.t);

      const isArea = f => f && f.geometry && f.geometry.type !== 'Point';
      let lastAreas = [], lastSrc = -1;
      borderFrames.forEach((fr, i) => {
        const own = fr.features.filter(isArea);
        if (own.length) { lastAreas = own; lastSrc = i; }
        fr.areas = lastAreas;
        fr.areaSrc = lastSrc;
      });

      // Bitwy: widoczne od pierwszej klatki, w której występują, przez czas trwania (właściwość czasTrwania w godzinach,
      // domyślnie 24 h) – a nie tylko w klatce, w której je postawiono.
      battleSpans = [];
      const seenBattles = new Map();
      borderFrames.forEach(fr => fr.features.forEach(ft => {
        const p = ft.properties || {};
        if (!(ft.geometry && ft.geometry.type === 'Point' && p.iconType === 'battle')) return;
        const key = p.name || JSON.stringify(ft.geometry.coordinates);
        let sp = seenBattles.get(key);
        if (!sp) { sp = { key, start: fr.t, versions: [] }; seenBattles.set(key, sp); battleSpans.push(sp); }
        sp.versions.push({ t: fr.t, ft });
      }));
      battleSpans.forEach(sp => {
        const hrs = Number(sp.versions[sp.versions.length - 1].ft.properties.czasTrwania);
        sp.end = sp.start + (hrs > 0 ? hrs : 24) * GODZINA;
      });

      const times = new Set(borderFrames.map(f => f.t));
      positionsByUnit.forEach(arr => arr.forEach(p => times.add(p.t)));
      allFrameTimes = [...times].sort((a, b) => a - b);
    }

    // ---------- Mapa ----------
    function setupMap() {
      map = L.map('map', { zoomControl: false, preferCanvas: true }).setView([52.0, 19.0], 6);
      L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; OSM' }).addTo(map);
      L.control.zoom({ position: 'bottomright' }).addTo(map);

      // SVG jest wymagane do płynnych przejść z transition: d w CSS
      areasLayer = L.geoJSON(null).addTo(map);
      battlesLayer = L.layerGroup().addTo(map);

      const bounds = L.latLngBounds([]);
      dataCache.positions.forEach(p => bounds.extend([p.latitude, p.longitude]));
      borderFrames.forEach(f => f.features.forEach(ft => {
        if (ft.geometry && ft.geometry.type === 'Point' && ft.properties && ft.properties.iconType === 'battle') {
          bounds.extend([ft.geometry.coordinates[1], ft.geometry.coordinates[0]]);
        }
      }));
      
      if (!bounds.isValid()) {
        const fr = borderFrames.find(f => f.areas && f.areas.length);
        if (fr) {
          try {
            const b = L.geoJSON({ type: 'FeatureCollection', features: fr.areas }).getBounds();
            if (b.isValid()) bounds.extend(b);
          } catch (e) { console.warn('Nie udało się obliczyć zasięgu granic', e); }
        }
      }
      if (bounds.isValid()) map.fitBounds(bounds.pad(0.1));
    }

    function renderLegend() {
      const el = document.getElementById('legend');
      if (dataCache.sides.length === 0) return;
      el.innerHTML = dataCache.sides.map(s =>
        `<div class="flex items-center gap-2 py-0.5"><span class="inline-block w-3 h-3 rounded-sm" style="background:${esc(s.color)}"></span><span class="text-slate-300">${esc(s.name)}</span></div>`
      ).join('');
      el.classList.remove('hidden');
    }

    // ---------- Oś czasu ----------
    function setupTimeline() {
      const parse = v => (v ? new Date(v).getTime() : NaN);
      startTimeMs = parse(campaign.start_time);
      endTimeMs = parse(campaign.end_time);
      if (!Number.isFinite(startTimeMs)) startTimeMs = allFrameTimes.length ? allFrameTimes[0] : Date.now();
      if (!Number.isFinite(endTimeMs)) endTimeMs = allFrameTimes.length ? allFrameTimes[allFrameTimes.length - 1] : startTimeMs + 24 * GODZINA;
      if (endTimeMs <= startTimeMs) endTimeMs = startTimeMs + GODZINA;
      currentTimeMs = startTimeMs;

      const slider = document.getElementById('timeline-slider');
      slider.min = startTimeMs;
      slider.max = endTimeMs;
      slider.step = 60000; 
      slider.value = startTimeMs;

      // Zmuszenie widoku to formatu zgodnego z TimeZone przeglądarki z włączonym rokiem
      document.getElementById('time-start').innerText = formatDateTime(startTimeMs);
      document.getElementById('time-end').innerText = formatDateTime(endTimeMs);
      document.getElementById('header-badge').innerText = `${allFrameTimes.length} klatek · ${dataCache.units.length} jednostek`;

      const ticks = document.getElementById('timeline-ticks');
      const span = endTimeMs - startTimeMs;
      ticks.innerHTML = '';
      allFrameTimes.forEach(t => {
        const pct = ((t - startTimeMs) / span) * 100;
        if (pct < 0 || pct > 100) return;
        const d = document.createElement('div');
        d.className = 'absolute top-0 w-[3px] h-2 bg-red-500/70 rounded';
        d.style.left = pct + '%'; d.style.marginLeft = '-1px';
        ticks.appendChild(d);
      });

      slider.addEventListener('input', e => { currentTimeMs = parseInt(e.target.value, 10); updateVisuals(); });
      document.getElementById('btn-play').addEventListener('click', togglePlay);
      document.getElementById('btn-prev-frame').addEventListener('click', () => jumpToFrame(-1));
      document.getElementById('btn-next-frame').addEventListener('click', () => jumpToFrame(1));
      document.getElementById('toggle-names-btn').addEventListener('click', toggleNames);
    }

    function setTime(ms) {
      currentTimeMs = Math.min(endTimeMs, Math.max(startTimeMs, ms));
      document.getElementById('timeline-slider').value = currentTimeMs;
      updateVisuals();
    }

    function jumpToFrame(dir) {
      const EPS = 1000;
      let target = null;
      if (dir < 0) {
        for (let i = allFrameTimes.length - 1; i >= 0; i--) if (allFrameTimes[i] < currentTimeMs - EPS) { target = allFrameTimes[i]; break; }
        if (target === null) target = startTimeMs;
      } else {
        target = allFrameTimes.find(t => t > currentTimeMs + EPS);
        if (target === undefined) target = endTimeMs;
      }
      setTime(target);
    }

    function stopPlay() {
      clearInterval(playTimer);
      playTimer = null;
      const btn = document.getElementById('btn-play');
      btn.innerHTML = '<i class="fa-solid fa-play ml-1 text-xl"></i>';
      btn.classList.remove('border-tactical-accent', 'text-tactical-accent');
    }

    function togglePlay() {
      if (playTimer) { stopPlay(); return; }
      if (currentTimeMs >= endTimeMs) setTime(startTimeMs);

      const btn = document.getElementById('btn-play');
      btn.innerHTML = '<i class="fa-solid fa-pause text-xl"></i>';
      btn.classList.add('border-tactical-accent', 'text-tactical-accent');

      playTimer = setInterval(() => {
        const hoursPerSec = Number(document.getElementById('speed-select').value);
        const step = hoursPerSec * GODZINA * (TICK_MS / 1000);
        const next = currentTimeMs + step;
        if (next >= endTimeMs) { setTime(endTimeMs); stopPlay(); return; }
        setTime(next);
      }, TICK_MS);
    }

    function firstFrameAfter(t) {
      let lo = 0, hi = allFrameTimes.length;
      while (lo < hi) { const mid = (lo + hi) >> 1; if (allFrameTimes[mid] > t) hi = mid; else lo = mid + 1; }
      return lo < allFrameTimes.length ? allFrameTimes[lo] : null;
    }

    // Jednostka jest usunięta w chwili t, jeśli między jej ostatnią pozycją (<= t) a t wystąpiło zdarzenie 'removed'.
    // Późniejsza pozycja (ponowne dodanie w edytorze) przywraca jednostkę.
    function isRemoved(unitId, timeMs) {
      const rem = removedAt.get(unitId);
      if (!rem || rem.length === 0) return false;
      const arr = positionsByUnit.get(unitId);
      if (!arr || arr.length === 0) return false;
      let lastT = null;
      for (let i = arr.length - 1; i >= 0; i--) if (arr[i].t <= timeMs) { lastT = arr[i].t; break; }
      if (lastT === null) return false;
      return rem.some(r => r > lastT && r <= timeMs);
    }

    function getUnitState(unitId, timeMs, ignoreRemoval = false) {
      const arr = positionsByUnit.get(unitId);
      if (!arr || arr.length === 0) return null;
      if (timeMs < arr[0].t) return null;
      if (!ignoreRemoval && isRemoved(unitId, timeMs)) return null;

      const last = arr[arr.length - 1];
      if (timeMs >= last.t) {
        // Jednostka zostaje na ostatniej znanej pozycji (znika dopiero przez zdarzenie destroyed/eliminated,
        // obsługiwane w updateVisuals). Wcześniej znikała na pierwszej klatce globalnej po ostatniej pozycji.
        return last;
      }

      let lo = 0, hi = arr.length - 1;
      while (hi - lo > 1) { const mid = (lo + hi) >> 1; if (arr[mid].t <= timeMs) lo = mid; else hi = mid; }
      const a = arr[lo], b = arr[hi];
      if (b.t === a.t) return a;
      const f = (timeMs - a.t) / (b.t - a.t);
      return {
        latitude: a.latitude + (b.latitude - a.latitude) * f,
        longitude: a.longitude + (b.longitude - a.longitude) * f,
        strength: a.strength,
        heading: a.heading
      };
    }

    function findBorderIdxA(t) {
      let lo = 0, hi = borderFrames.length - 1, res = -1;
      while (lo <= hi) { const mid = (lo + hi) >> 1; if (borderFrames[mid].t <= t) { res = mid; lo = mid + 1; } else hi = mid - 1; }
      return res;
    }

    function sideColor(frakcjaId) {
      const s = frakcjaId ? sideById.get(frakcjaId) : null;
      return s ? s.color : null;
    }

    function tooltipOpts() {
      return { permanent: namesOn, sticky: !namesOn, direction: 'center', className: TOOLTIP_CLASS };
    }

    function areaStyle(props) {
      const col = sideColor(props.frakcja) || props.color;
      if (!col) return { color: '#64748b', fillColor: '#334155', fillOpacity: 0.2, weight: 2 };
      return { color: col, fillColor: col, fillOpacity: 0.35, weight: 2 };
    }


    // Główny Render Granic (bez animacji interpolacji)
    function renderBorders(timeMs) {
      const idxA = findBorderIdxA(timeMs);
      
      if (idxA < 0) {
          battlesLayer.clearLayers();
          areasLayer.clearLayers();
          activePolygonsMap.clear();
          return;
      }

      const frameA = borderFrames[idxA];
      const currentFeaturesToDraw = frameA.areas || [];

      // Aktualizowanie istniejących warstw i dodawanie nowych
      const currentNamesInFrame = new Set();

      currentFeaturesToDraw.forEach(feat => {
          const name = feat.properties?.name || feat.properties?.NAME || feat.properties?.SUBJECTO || 'unknown_' + Math.random();
          currentNamesInFrame.add(name);
          
          if(activePolygonsMap.has(name)) {
              // Aktualizacja Kształtu (skokowa)
              const existingLayer = activePolygonsMap.get(name);
              existingLayer.clearLayers();
              existingLayer.addData(feat);
          } else {
              // Nowa granica pojawia się po raz pierwszy
              const newGeoJsonLayer = L.geoJSON(feat, {
                  style: f => areaStyle(f.properties || {}),
                  onEachFeature: (f, layer) => {
                      const p = f.properties || {};
                      const tooltipName = p.name || p.NAME || p.SUBJECTO;
                      if (tooltipName) layer.bindTooltip(tooltipName, tooltipOpts());
                  }
              });
              activePolygonsMap.set(name, newGeoJsonLayer);
              newGeoJsonLayer.addTo(areasLayer);
          }
      });

      // Usuwamy państwa, których już nie ma na mapie (Zostały podbite/zniknęły)
      for (const [name, layer] of activePolygonsMap.entries()) {
          if (!currentNamesInFrame.has(name)) {
              areasLayer.removeLayer(layer);
              activePolygonsMap.delete(name);
          }
      }
      
      // Renderowanie BITEW: w klatce, w której są zapisane, oraz w czasie trwania
      battlesLayer.clearLayers();
      const jestBitwa = f => f.geometry && f.geometry.type === 'Point' && f.properties && f.properties.iconType === 'battle';
      
      battleSpans.forEach(sp => {
        let feature = frameA.features.find(f => jestBitwa(f) && (f.properties.name || JSON.stringify(f.geometry.coordinates)) === sp.key);
        if (!feature && timeMs >= sp.start && timeMs < sp.end) {
          sp.versions.forEach(v => { if (v.t <= timeMs) feature = v.ft; });
        }
        if (!feature) return;
        
        const props = feature.properties || {};
        const name = props.name || props.NAME || props.SUBJECTO;
        const color = sideColor(props.frakcja) || '#ef4444';
        const [lng, lat] = feature.geometry.coordinates;
        
        const icon = L.divIcon({
          className: '', iconSize: [50, 50], iconAnchor: [25, 25],
          html: `<div class="battle-badge" style="border-color:${esc(color)};box-shadow:0 0 20px ${esc(color)}, inset 0 0 10px rgba(0,0,0,0.5)"><i class="${ICONS.battle}"></i></div>`
        });
        
        const m = L.marker([lat, lng], { icon, zIndexOffset: 500 }).addTo(battlesLayer);
        if (name) m.bindTooltip(name, tooltipOpts());
        m.on('click', () => selectBattle(props, [lat, lng]));
      });
    }

    function toggleNames() {
      namesOn = !namesOn;
      const btn = document.getElementById('toggle-names-btn');
      btn.classList.toggle('bg-tactical-accent', namesOn);
      btn.classList.toggle('border-tactical-accent', namesOn);

      const rebind = (layer, name) => { layer.unbindTooltip(); layer.bindTooltip(name, tooltipOpts()); };
      dataCache.units.forEach(u => { if (markers[u.id]) rebind(markers[u.id], u.name); });
      
      // Wymuszamy restart tooltipów dla granic
      areasLayer.eachLayer(group => {
          group.eachLayer(layer => {
              const p = layer.feature?.properties || {};
              const name = p.name || p.NAME || p.SUBJECTO;
              if(name) {
                  layer.unbindTooltip(); layer.bindTooltip(name, tooltipOpts());
              }
          })
      });

      updateVisuals();
    }

    function unitIconType(unit) {
      return unit.symbol && unit.symbol !== 'none' ? unit.symbol : unit.unit_type;
    }

    function unitIconHtml(unit, color, isDestroyed, isExploding, isSelected) {
      const cls = ['unit-badge'];
      if (isDestroyed) cls.push('destroyed');
      if (isExploding) cls.push('exploding');
      if (isSelected && !isDestroyed) cls.push('selected');
      const iconClass = ICONS[unitIconType(unit)] || 'fa-solid fa-location-dot';
      return `<div class="${cls.join(' ')}" style="border-color:${esc(color)}"><i class="${iconClass}"></i></div>`;
    }

    // ---------- Główne odświeżanie widoku ----------
    function updateVisuals() {
      document.getElementById('time-current').innerText = formatDateTime(currentTimeMs);
      const onFrame = allFrameTimes.includes(currentTimeMs);
      document.getElementById('frame-flag').classList.toggle('hidden', !onFrame);

      renderBorders(currentTimeMs);

      dataCache.units.forEach(unit => {
        const side = sideById.get(unit.side_id);
        const color = side ? side.color : '#ffffff';
        // Jednostka usunięta w edytorze (także zniszczona) nie jest już widoczna
        if (isRemoved(unit.id, currentTimeMs)) {
          if (markers[unit.id]) { map.removeLayer(markers[unit.id]); delete markers[unit.id]; }
          return;
        }
        const destroyedT = destroyedAt.get(unit.id);
        const isDestroyed = destroyedT !== undefined && destroyedT <= currentTimeMs;
        const isExploding = isDestroyed && currentTimeMs <= destroyedT + EXPLOSION_MS;

        const state = isDestroyed ? getUnitState(unit.id, destroyedT, true) : getUnitState(unit.id, currentTimeMs);

        if (!state) {
          if (markers[unit.id]) { map.removeLayer(markers[unit.id]); delete markers[unit.id]; }
          return;
        }

        const isSelected = selectedUnitId === unit.id;
        const key = `${color}|${isDestroyed}|${isExploding}|${isSelected}`;
        const latlng = [state.latitude, state.longitude];

        if (!markers[unit.id]) {
          const m = L.marker(latlng, {
            icon: L.divIcon({ className: '', html: unitIconHtml(unit, color, isDestroyed, isExploding, isSelected), iconSize: [32, 32], iconAnchor: [16, 16] })
          }).addTo(map);
          m._key = key;
          m.bindTooltip(unit.name, { ...tooltipOpts(), direction: 'top', offset: [0, -18] });
          m.on('click', () => selectUnit(unit.id));
          markers[unit.id] = m;
        } else {
          const m = markers[unit.id];
          m.setLatLng(latlng);
          if (m._key !== key) {
            m._key = key;
            m.setIcon(L.divIcon({ className: '', html: unitIconHtml(unit, color, isDestroyed, isExploding, isSelected), iconSize: [32, 32], iconAnchor: [16, 16] }));
            m.setZIndexOffset(isExploding ? 1000 : 0);
          }
        }
      });

      if (selectedUnitId) updateSidePanel();
    }

    // ---------- Panel boczny ----------
    function openPanel() { document.getElementById('side-panel').classList.remove('-translate-x-full'); }
    function hidePanelOnMobile() { document.getElementById('side-panel').classList.add('-translate-x-full'); }

    function setPanel(html) {
      if (html === lastPanelHtml) return; 
      lastPanelHtml = html;
      document.getElementById('panel-content').innerHTML = html;
    }

    function emptyPanelHtml() {
      return `
        <div class="text-center text-slate-500 mt-10">
          <i class="fa-solid fa-crosshairs text-4xl mb-4 text-tactical-700"></i>
          <p>Kliknij jednostkę lub bitwę na mapie, aby odczytać jej dane i rozkazy.</p>
        </div>`;
    }
    function renderEmptyPanel() { setPanel(emptyPanelHtml()); }

    function showFatal(msg) {
      setPanel(`
        <div class="text-center mt-10">
          <i class="fa-solid fa-triangle-exclamation text-4xl mb-4 text-red-500"></i>
          <p class="text-red-400 font-bold mb-2">Nie udało się wczytać kampanii</p>
          <p class="text-slate-400 text-sm">${esc(msg)}</p>
        </div>`);
      openPanel();
    }

    function selectUnit(id) {
      selectedBattle = null;
      selectedUnitId = id;
      openPanel();
      updateVisuals();
    }

    function selectBattle(props, latlng) {
      selectedUnitId = null;
      if (targetLine) { map.removeLayer(targetLine); targetLine = null; }
      selectedBattle = props;
      openPanel();
      updateVisuals(); 

      const side = props.frakcja ? sideById.get(props.frakcja) : null;
      setPanel(`
        <div class="flex justify-between items-start mb-4 border-b border-tactical-700 pb-3">
          <span class="text-[10px] uppercase font-bold px-2 py-1 rounded text-white bg-red-700">Bitwa</span>
          <button onclick="closePanel()" class="text-slate-500 hover:text-white"><i class="fa-solid fa-times"></i></button>
        </div>
        <h2 class="text-2xl font-bold text-white mb-1">${esc(props.name || 'Bitwa bez nazwy')}</h2>
        ${side ? `<p class="text-sm text-slate-400 mb-4">Inicjator: <span style="color:${esc(side.color)}">${esc(side.name)}</span></p>` : '<div class="mb-4"></div>'}
        <h3 class="text-xs font-bold text-slate-500 uppercase tracking-widest mb-2">Opis</h3>
        <p class="text-slate-300 text-sm leading-relaxed mb-5">${esc(props.description) || '<span class="italic text-slate-500">Brak opisu.</span>'}</p>
        <h3 class="text-xs font-bold text-slate-500 uppercase tracking-widest mb-2">Wynik</h3>
        <p class="text-slate-300 text-sm leading-relaxed">${esc(props.result) || '<span class="italic text-slate-500">Brak wyniku.</span>'}</p>
      `);
    }

    function getActiveOrders(unitId, t) {
      const list = dataCache.orders
        .filter(o => o.unit_id === unitId)
        .map(o => ({
          o,
          from: new Date(o.valid_from || o.issued_at).getTime(),
          until: o.valid_until ? new Date(o.valid_until).getTime() : Infinity
        }))
        .filter(x => t >= x.from && t <= x.until)
        .sort((a, b) => a.from - b.from);
      const lastOpen = [...list].reverse().find(x => x.until === Infinity);
      return list.filter(x => x.until !== Infinity || x === lastOpen).map(x => x.o);
    }

    function updateSidePanel() {
      const unit = dataCache.units.find(u => u.id === selectedUnitId);
      if (!unit) return;
      if (isRemoved(unit.id, currentTimeMs)) { closePanel(); return; }
      const side = sideById.get(unit.side_id);
      const sideCol = side ? side.color : '#6b7280';

      const destroyedT = destroyedAt.get(unit.id);
      const isDestroyed = destroyedT !== undefined && destroyedT <= currentTimeMs;
      const checkTime = isDestroyed ? destroyedT : currentTimeMs;
      const pos = getUnitState(selectedUnitId, checkTime, isDestroyed);

      const activeOrders = isDestroyed ? [] : getActiveOrders(selectedUnitId, currentTimeMs);
      const withTarget = [...activeOrders].reverse().find(o => o.target_latitude != null && o.target_longitude != null);

      if (withTarget && pos) {
        const pts = [[pos.latitude, pos.longitude], [withTarget.target_latitude, withTarget.target_longitude]];
        if (targetLine) { targetLine.setLatLngs(pts); targetLine.setStyle({ color: sideCol }); }
        else targetLine = L.polyline(pts, { color: sideCol, weight: 2, dashArray: '5, 10', opacity: 0.8, interactive: false }).addTo(map);
      } else if (targetLine) { map.removeLayer(targetLine); targetLine = null; }

      const ordersHtml = activeOrders.length ? activeOrders.map(o => `
          <div class="bg-tactical-900 border border-l-4 border-tactical-700 rounded p-4 shadow-md mb-2" style="border-left-color:${esc(sideCol)}">
            <div class="flex justify-between text-xs text-slate-400 mb-2">
              <span class="uppercase font-bold text-white">${esc(ORDER_LABELS[o.order_type] || o.order_type)}</span>
              <span>${esc(formatDateTime(new Date(o.valid_from || o.issued_at).getTime()))}</span>
            </div>
            <p class="text-slate-300 text-sm leading-relaxed">${esc(o.description)}</p>
          </div>`).join('') : `
          <div class="text-slate-500 text-sm italic border border-dashed border-tactical-700 p-4 rounded text-center">
            Brak aktywnych rozkazów.
          </div>`;

      setPanel(`
        <div class="flex justify-between items-start mb-4 border-b border-tactical-700 pb-3">
          <span class="text-[10px] uppercase font-bold px-2 py-1 rounded text-white" style="background-color:${esc(sideCol)}">
            ${side ? esc(side.name) : 'Nieznana'}
          </span>
          <button onclick="closePanel()" class="text-slate-500 hover:text-white"><i class="fa-solid fa-times"></i></button>
        </div>

        <h2 class="text-2xl font-bold text-white mb-1 ${isDestroyed ? 'line-through text-slate-500' : ''}">${esc(unit.name)}</h2>
        <p class="text-sm text-slate-400 mb-6">Typ: <span class="uppercase border border-slate-600 px-1 ml-2 text-[10px]">${esc(unit.symbol && unit.symbol !== 'none' ? unit.symbol : '')}</span></p>

        ${isDestroyed ? `
          <div class="bg-red-900/20 border border-red-500/50 p-4 rounded mb-6 text-center">
            <i class="fa-solid fa-skull-crossbones text-2xl text-red-500 mb-2"></i>
            <p class="text-red-400 font-bold text-sm uppercase">Jednostka zniszczona</p>
            <p class="text-xs text-slate-400 mt-1">Stracona: ${esc(formatDateTime(destroyedT))}</p>
          </div>
        ` : `
          <div class="grid grid-cols-2 gap-3 mt-4 text-sm mb-6">

          </div>
        `}

        <h3 class="text-xs font-bold text-slate-500 uppercase tracking-widest mb-3">Aktywne rozkazy</h3>
        ${ordersHtml}
      `);
    }

    function closePanel() {
      selectedUnitId = null;
      selectedBattle = null;
      if (targetLine) { map.removeLayer(targetLine); targetLine = null; }
      renderEmptyPanel();
      hidePanelOnMobile();
      updateVisuals();
    }

    function formatDateTime(ms) {
      return new Date(ms).toLocaleString('pl-PL', { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    }

    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
